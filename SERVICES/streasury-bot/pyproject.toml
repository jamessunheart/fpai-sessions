[project]
name = "streasury-bot"
version = "0.1.0"
description = "Sovereign treasury Telegram bot with AI council and Postgres ledger"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<0.28",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "python-dateutil>=2.9",
    "tabulate>=0.9",
]

[project.scripts]
streasury-bot = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]
