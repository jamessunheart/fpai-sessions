{% if items %}
    <div class="grid grid-cols-1 gap-2">
        {% for item in items %}
        <div class="bg-slate-800/50 border border-purple-500/30 p-2 rounded flex items-center justify-between">
            <div>
                <div class="text-sm font-mono text-purple-300">{{ item.name }}</div>
                <div class="text-xs text-slate-500">Waiting in Quarantine</div>
            </div>
            <div class="flex gap-2">
                <button class="text-xs bg-green-900/50 hover:bg-green-900 text-green-400 px-2 py-1 rounded border border-green-800">Promote</button>
                <button class="text-xs bg-red-900/50 hover:bg-red-900 text-red-400 px-2 py-1 rounded border border-red-800">Reject</button>
            </div>
        </div>
        {% endfor %}
    </div>
{% else %}
    <div class="flex items-center justify-center h-full text-slate-600">
        <div class="text-center">
            <div class="text-2xl mb-2">🛡️</div>
            <p>Perimeter Secure</p>
            <p class="text-xs">No foreign code detected</p>
        </div>
    </div>
{% endif %}
