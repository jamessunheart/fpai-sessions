<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Potential AI | Bounty Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background: #050505; color: #fff; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-border { box-shadow: 0 0 10px rgba(168, 85, 247, 0.2); border: 1px solid rgba(168, 85, 247, 0.5); }
    </style>
</head>
<body class="min-h-screen p-8" x-data="bounties()">

    <header class="max-w-6xl mx-auto mb-12 flex justify-between items-center">
        <div>
            <h1 class="text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600 mb-2">Bounty Board</h1>
            <p class="text-gray-400">Execute Missions. Earn Universal Credits (UC).</p>
        </div>
        <div class="text-right">
            <div class="text-2xl font-bold text-purple-400">1 UC = $1.00 USD</div>
            <a href="/join" class="text-sm text-gray-500 hover:text-white underline">Join Core Team →</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Bounty Card Template -->
        <template x-for="mission in missions" :key="mission.id">
            <div class="glass rounded-xl p-6 hover:border-purple-500/50 transition group relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-purple-600 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">
                    OPEN
                </div>
                
                <div class="mb-4">
                    <div class="text-xs text-purple-400 uppercase tracking-widest mb-1" x-text="mission.type"></div>
                    <h3 class="text-2xl font-bold text-white mb-2 group-hover:text-purple-300 transition" x-text="mission.title"></h3>
                    <p class="text-gray-400 text-sm leading-relaxed" x-text="mission.description"></p>
                </div>

                <div class="flex justify-between items-end border-t border-white/10 pt-4">
                    <div>
                        <div class="text-xs text-gray-500 uppercase">Reward</div>
                        <div class="text-3xl font-bold text-green-400" x-text="mission.reward + ' UC'"></div>
                    </div>
                    <button @click="apply(mission)" class="bg-white/10 hover:bg-purple-600 text-white px-6 py-2 rounded-lg font-bold transition border border-white/20">
                        Claim Bounty
                    </button>
                </div>
            </div>
        </template>
    </main>

    <!-- Application Modal -->
    <div x-show="activeMission" class="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-50" x-transition>
        <div class="glass p-8 rounded-2xl max-w-lg w-full border border-purple-500/30">
            <h2 class="text-2xl font-bold mb-2">Claim: <span x-text="activeMission?.title" class="text-purple-400"></span></h2>
            <p class="text-gray-400 text-sm mb-6">To start this mission, you must authenticate.</p>
            
            <input type="email" x-model="email" placeholder="Your Email Address" class="w-full bg-black/50 border border-white/20 rounded-lg p-4 mb-4 text-white">
            
            <div class="flex gap-4">
                <button @click="activeMission = null" class="flex-1 py-3 rounded-lg text-gray-400 hover:text-white">Cancel</button>
                <button @click="submitClaim()" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-lg shadow-lg shadow-purple-900/50">
                    Start Mission
                </button>
            </div>
            <p class="text-xs text-gray-500 mt-4 text-center">We will send a Magic Link to access the secure workspace.</p>
        </div>
    </div>

    <script>
        function bounties() {
            return {
                activeMission: null,
                email: '',
                missions: [
                    { id: 1, type: 'Procurement', title: 'Secure OpenAI API Key', description: 'Register a new organization, add payment method (provided), and generate a production key.', reward: 50 },
                    { id: 2, type: 'Research', title: 'Find 5 AI Newsletters', description: 'Locate 5 high-signal AI newsletters for our Cortex Feed. Must accept automated signups.', reward: 30 },
                    { id: 3, type: 'DevOps', title: 'Setup Twilio Voice', description: 'Configure a Twilio account for programmable voice handling. Buy 1 number.', reward: 100 },
                    { id: 4, type: 'Creative', title: 'Viral Tweet Thread', description: 'Draft a 5-tweet thread about "Conscious AI Agents". Must cite sources.', reward: 75 }
                ],
                
                apply(mission) {
                    this.activeMission = mission;
                },
                
                async submitClaim() {
                    if (!this.email) return alert("Email required");
                    
                    // Call Team Hub Invite/Magic Link API
                    try {
                        const res = await fetch('/auth/request-magic-link', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ email: this.email })
                        });
                        
                        if (res.ok) {
                            alert(`Mission assigned! Check ${this.email} to enter the workspace.`);
                            this.activeMission = null;
                            this.email = '';
                        } else {
                            alert("Please request an invite from the administrator first.");
                        }
                    } catch (e) {
                        alert("System error. Contact admin.");
                    }
                }
            }
        }
    </script>
</body>
</html>
