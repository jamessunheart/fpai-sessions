# ====================================================
# 👥 TEAM PORTAL v2.2 - Human-AI Collaboration Hub
# Port: 8355
# ====================================================

# Dashboard route (main UI)
location = /dashboards/team {
    return 301 /dashboards/team/;
}

location /dashboards/team/ {
    rewrite ^/dashboards/team/(.*) /$1 break;
    proxy_pass http://127.0.0.1:8355;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Services route (API endpoints)
location = /services/team {
    return 301 /services/team/;
}

location /services/team/ {
    rewrite ^/services/team/(.*) /$1 break;
    proxy_pass http://127.0.0.1:8355;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# FP SafeLink (Public Utility)
location /services/safelink {
    proxy_pass http://127.0.0.1:8355/services/safelink;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/public/safelink {
    proxy_pass http://127.0.0.1:8355/api/public/safelink;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /vault/share/ {
    proxy_pass http://127.0.0.1:8355/vault/share/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Auth endpoints
location /services/team/auth/ {
    rewrite ^/services/team/(.*) /$1 break;
    proxy_pass http://127.0.0.1:8355;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API endpoints
location /services/team/api/ {
    rewrite ^/services/team/(.*) /$1 break;
    proxy_pass http://127.0.0.1:8355;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}











