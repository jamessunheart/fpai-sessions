services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: zv-evolution-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - evolution_instances:/evolution/instances
      - ./evolution-api/.env:/evolution/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  evolution_instances:
