<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aria IDE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --success: #3fb950;
            --danger: #f85149;
            --warning: #d29922;
            --border: #30363d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
        }

        .file-path {
            font-size: 12px;
            color: var(--text-secondary);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        /* Main Content */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width 0.2s;
        }

        .sidebar.collapsed {
            width: 40px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .toggle-sidebar {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }

        .tree-item {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
            transition: background 0.1s;
        }

        .tree-item:hover {
            background: var(--bg-tertiary);
        }

        .tree-item.active {
            background: var(--bg-tertiary);
            color: var(--accent);
        }

        .tree-item.directory {
            font-weight: 500;
        }

        .tree-icon {
            margin-right: 6px;
            width: 16px;
            text-align: center;
        }

        .tree-indent {
            display: inline-block;
        }

        /* Editor Area */
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            border-right: 1px solid var(--border);
            cursor: pointer;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .tab-close {
            opacity: 0;
            font-size: 14px;
            padding: 2px;
            border-radius: 3px;
        }

        .tab:hover .tab-close {
            opacity: 1;
        }

        .tab-close:hover {
            background: var(--danger);
            color: #fff;
        }

        .tab-modified {
            width: 8px;
            height: 8px;
            background: var(--warning);
            border-radius: 50%;
        }

        /* Monaco Editor */
        #editor {
            flex: 1;
        }

        /* Diff View */
        .diff-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .diff-panel.visible {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .diff-content {
            background: var(--bg-secondary);
            border-radius: 12px;
            width: 90%;
            max-width: 900px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .diff-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .diff-title {
            font-size: 16px;
            font-weight: 600;
        }

        .diff-stats {
            display: flex;
            gap: 12px;
            font-size: 13px;
        }

        .diff-stats .additions {
            color: var(--success);
        }

        .diff-stats .deletions {
            color: var(--danger);
        }

        .diff-body {
            flex: 1;
            overflow: auto;
            padding: 16px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 12px;
            line-height: 1.5;
        }

        .diff-line {
            padding: 2px 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .diff-line.addition {
            background: rgba(63, 185, 80, 0.2);
            color: var(--success);
        }

        .diff-line.deletion {
            background: rgba(248, 81, 73, 0.2);
            color: var(--danger);
        }

        .diff-line.context {
            color: var(--text-secondary);
        }

        .diff-line.header {
            color: var(--accent);
            font-weight: bold;
        }

        .diff-actions {
            display: flex;
            gap: 12px;
            padding: 16px;
            border-top: 1px solid var(--border);
            justify-content: flex-end;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 12px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Search Modal */
        .search-modal {
            display: none;
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 500px;
            max-width: 90%;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .search-modal.visible {
            display: block;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: none;
            border-radius: 8px 8px 0 0;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .search-results {
            max-height: 300px;
            overflow-y: auto;
        }

        .search-result {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }

        .search-result:hover {
            background: var(--bg-tertiary);
        }

        .search-result-path {
            font-size: 12px;
            color: var(--accent);
        }

        .search-result-preview {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 60px;
            right: 20px;
            z-index: 2000;
        }

        .toast {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 13px;
            animation: slideIn 0.2s ease;
        }

        .toast.success {
            border-color: var(--success);
        }

        .toast.error {
            border-color: var(--danger);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .sidebar {
                position: fixed;
                left: -240px;
                top: 0;
                bottom: 0;
                z-index: 100;
                transition: left 0.2s;
            }

            .sidebar.open {
                left: 0;
            }

            .file-path {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <span class="logo">Aria IDE</span>
                <span class="file-path" id="currentPath">No file open</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="showSearch()">Search</button>
                <button class="btn btn-primary" onclick="showDiff()" id="reviewBtn" disabled>Review</button>
                <button class="btn btn-success" onclick="saveFile()" id="saveBtn" disabled>Save</button>
            </div>
        </div>

        <!-- Main -->
        <div class="main">
            <!-- Sidebar -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-title">Explorer</span>
                    <button class="toggle-sidebar" onclick="toggleSidebar()">
                        <span id="sidebarIcon">◀</span>
                    </button>
                </div>
                <div class="file-tree" id="fileTree">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Editor Area -->
            <div class="editor-area">
                <div class="tabs" id="tabs"></div>
                <div id="editor"></div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item" id="cursorPosition">Ln 1, Col 1</div>
            <div class="status-item" id="fileLanguage">Plain Text</div>
        </div>
    </div>

    <!-- Diff Panel -->
    <div class="diff-panel" id="diffPanel">
        <div class="diff-content">
            <div class="diff-header">
                <span class="diff-title">Review Changes</span>
                <div class="diff-stats">
                    <span class="additions" id="diffAdditions">+0</span>
                    <span class="deletions" id="diffDeletions">-0</span>
                </div>
            </div>
            <div class="diff-body" id="diffBody"></div>
            <div class="diff-actions">
                <button class="btn btn-secondary" onclick="closeDiff()">Cancel</button>
                <button class="btn btn-success" onclick="applyChanges()">Apply Changes</button>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div class="search-modal" id="searchModal">
        <input type="text" class="search-input" id="searchInput" placeholder="Search files..." onkeyup="debounceSearch(event)">
        <div class="search-results" id="searchResults"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // API Base URL
        const API_BASE = window.location.origin + '/miniapp';

        // State
        let editor = null;
        let openFiles = new Map(); // path -> { content, originalContent, hash, modified }
        let activeFile = null;
        let searchTimeout = null;

        // Initialize Monaco Editor
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
        
        require(['vs/editor/editor.main'], function () {
            // Define custom dark theme
            monaco.editor.defineTheme('aria-dark', {
                base: 'vs-dark',
                inherit: true,
                rules: [],
                colors: {
                    'editor.background': '#0d1117',
                    'editor.foreground': '#c9d1d9',
                    'editorLineNumber.foreground': '#6e7681',
                    'editorCursor.foreground': '#58a6ff',
                    'editor.selectionBackground': '#264f78',
                    'editor.lineHighlightBackground': '#161b22'
                }
            });

            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '// Welcome to Aria IDE\n// Select a file from the explorer to start editing',
                language: 'javascript',
                theme: 'aria-dark',
                automaticLayout: true,
                minimap: { enabled: false },
                fontSize: 13,
                lineNumbers: 'on',
                scrollBeyondLastLine: false,
                wordWrap: 'on',
                tabSize: 4,
                insertSpaces: true
            });

            // Track cursor position
            editor.onDidChangeCursorPosition((e) => {
                document.getElementById('cursorPosition').textContent = 
                    `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
            });

            // Track content changes
            editor.onDidChangeModelContent(() => {
                if (activeFile && openFiles.has(activeFile)) {
                    const file = openFiles.get(activeFile);
                    file.content = editor.getValue();
                    file.modified = file.content !== file.originalContent;
                    updateTabs();
                    updateButtons();
                }
            });

            // Load file tree
            loadFileTree();
        });

        // Load File Tree
        async function loadFileTree(path = '') {
            try {
                const response = await fetch(`${API_BASE}/tree?path=${encodeURIComponent(path)}&depth=3`);
                const data = await response.json();
                renderFileTree(data.tree);
            } catch (error) {
                showToast('Failed to load file tree', 'error');
            }
        }

        // Render File Tree
        function renderFileTree(tree, indent = 0) {
            const container = document.getElementById('fileTree');
            container.innerHTML = '';
            
            function renderNode(node, depth) {
                const div = document.createElement('div');
                div.className = `tree-item ${node.type}`;
                div.style.paddingLeft = `${8 + depth * 16}px`;
                
                const icon = node.type === 'directory' ? '📁' : getFileIcon(node.name);
                div.innerHTML = `<span class="tree-icon">${icon}</span>${node.name}`;
                
                if (node.type === 'file') {
                    div.onclick = () => openFile(node.path);
                } else if (node.children) {
                    div.onclick = (e) => {
                        e.stopPropagation();
                        const isCollapsed = div.classList.toggle('collapsed');
                        const childContainer = div.nextElementSibling;
                        if (childContainer) {
                            childContainer.style.display = isCollapsed ? 'none' : 'block';
                        }
                    };
                }
                
                container.appendChild(div);
                
                if (node.type === 'directory' && node.children) {
                    const childContainer = document.createElement('div');
                    node.children.forEach(child => {
                        renderNode(child, depth + 1);
                    });
                }
            }
            
            tree.forEach(node => renderNode(node, 0));
        }

        // Get file icon based on extension
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'py': '🐍', 'js': '📜', 'ts': '💎', 'json': '📋',
                'md': '📝', 'html': '🌐', 'css': '🎨', 'sh': '⚡',
                'yaml': '⚙️', 'yml': '⚙️', 'sql': '🗃️', 'go': '🔵',
                'rs': '🦀', 'java': '☕', 'rb': '💎', 'php': '🐘'
            };
            return icons[ext] || '📄';
        }

        // Open File
        async function openFile(path) {
            try {
                const response = await fetch(`${API_BASE}/file?path=${encodeURIComponent(path)}`);
                if (!response.ok) throw new Error('Failed to load file');
                
                const data = await response.json();
                
                openFiles.set(path, {
                    content: data.content,
                    originalContent: data.content,
                    hash: data.hash,
                    language: data.language,
                    modified: false
                });
                
                activeFile = path;
                editor.setValue(data.content);
                monaco.editor.setModelLanguage(editor.getModel(), data.language);
                
                document.getElementById('currentPath').textContent = path;
                document.getElementById('fileLanguage').textContent = data.language;
                
                updateTabs();
                updateButtons();
                
                // Highlight active in tree
                document.querySelectorAll('.tree-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.textContent.includes(path.split('/').pop())) {
                        item.classList.add('active');
                    }
                });
                
            } catch (error) {
                showToast(`Failed to open file: ${error.message}`, 'error');
            }
        }

        // Update Tabs
        function updateTabs() {
            const tabsContainer = document.getElementById('tabs');
            tabsContainer.innerHTML = '';
            
            openFiles.forEach((file, path) => {
                const tab = document.createElement('div');
                tab.className = `tab ${path === activeFile ? 'active' : ''}`;
                
                const name = path.split('/').pop();
                tab.innerHTML = `
                    ${file.modified ? '<span class="tab-modified"></span>' : ''}
                    <span onclick="switchToFile('${path}')">${name}</span>
                    <span class="tab-close" onclick="closeFile('${path}', event)">×</span>
                `;
                
                tabsContainer.appendChild(tab);
            });
        }

        // Switch to file
        function switchToFile(path) {
            if (!openFiles.has(path)) return;
            
            activeFile = path;
            const file = openFiles.get(path);
            editor.setValue(file.content);
            monaco.editor.setModelLanguage(editor.getModel(), file.language);
            
            document.getElementById('currentPath').textContent = path;
            document.getElementById('fileLanguage').textContent = file.language;
            
            updateTabs();
            updateButtons();
        }

        // Close file
        function closeFile(path, event) {
            event.stopPropagation();
            
            const file = openFiles.get(path);
            if (file.modified) {
                if (!confirm('You have unsaved changes. Close anyway?')) return;
            }
            
            openFiles.delete(path);
            
            if (path === activeFile) {
                const remaining = Array.from(openFiles.keys());
                if (remaining.length > 0) {
                    switchToFile(remaining[0]);
                } else {
                    activeFile = null;
                    editor.setValue('// No file open');
                    document.getElementById('currentPath').textContent = 'No file open';
                }
            }
            
            updateTabs();
            updateButtons();
        }

        // Update button states
        function updateButtons() {
            const hasActiveFile = activeFile && openFiles.has(activeFile);
            const isModified = hasActiveFile && openFiles.get(activeFile).modified;
            
            document.getElementById('saveBtn').disabled = !isModified;
            document.getElementById('reviewBtn').disabled = !isModified;
        }

        // Show diff panel
        async function showDiff() {
            if (!activeFile) return;
            
            const file = openFiles.get(activeFile);
            if (!file.modified) return;
            
            try {
                const response = await fetch(`${API_BASE}/diff`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        path: activeFile,
                        original_content: file.originalContent,
                        new_content: file.content
                    })
                });
                
                const diff = await response.json();
                
                document.getElementById('diffAdditions').textContent = `+${diff.additions}`;
                document.getElementById('diffDeletions').textContent = `-${diff.deletions}`;
                
                // Render diff
                const diffBody = document.getElementById('diffBody');
                diffBody.innerHTML = '';
                
                diff.diff_unified.split('\n').forEach(line => {
                    const div = document.createElement('div');
                    div.className = 'diff-line';
                    
                    if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('@@')) {
                        div.className += ' header';
                    } else if (line.startsWith('+')) {
                        div.className += ' addition';
                    } else if (line.startsWith('-')) {
                        div.className += ' deletion';
                    } else {
                        div.className += ' context';
                    }
                    
                    div.textContent = line;
                    diffBody.appendChild(div);
                });
                
                document.getElementById('diffPanel').classList.add('visible');
                
            } catch (error) {
                showToast('Failed to generate diff', 'error');
            }
        }

        // Close diff panel
        function closeDiff() {
            document.getElementById('diffPanel').classList.remove('visible');
        }

        // Apply changes (save)
        async function applyChanges() {
            closeDiff();
            await saveFile();
        }

        // Save file
        async function saveFile() {
            if (!activeFile) return;
            
            const file = openFiles.get(activeFile);
            if (!file.modified) return;
            
            try {
                const response = await fetch(`${API_BASE}/apply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        path: activeFile,
                        new_content: file.content,
                        expected_hash: file.hash
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to save');
                }
                
                const result = await response.json();
                
                // Update state
                file.originalContent = file.content;
                file.hash = result.new_hash;
                file.modified = false;
                
                updateTabs();
                updateButtons();
                
                showToast('File saved successfully', 'success');
                
            } catch (error) {
                showToast(`Failed to save: ${error.message}`, 'error');
            }
        }

        // Search
        function showSearch() {
            document.getElementById('searchModal').classList.add('visible');
            document.getElementById('searchInput').focus();
        }

        function hideSearch() {
            document.getElementById('searchModal').classList.remove('visible');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '';
        }

        function debounceSearch(event) {
            if (event.key === 'Escape') {
                hideSearch();
                return;
            }
            
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => performSearch(event.target.value), 300);
        }

        async function performSearch(query) {
            if (query.length < 2) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/search?query=${encodeURIComponent(query)}`);
                const results = await response.json();
                
                const container = document.getElementById('searchResults');
                container.innerHTML = '';
                
                results.slice(0, 20).forEach(result => {
                    const div = document.createElement('div');
                    div.className = 'search-result';
                    div.innerHTML = `
                        <div class="search-result-path">${result.path}:${result.line}</div>
                        <div class="search-result-preview">${result.content}</div>
                    `;
                    div.onclick = () => {
                        openFile(result.path);
                        hideSearch();
                        setTimeout(() => {
                            editor.revealLineInCenter(result.line);
                            editor.setPosition({ lineNumber: result.line, column: 1 });
                        }, 100);
                    };
                    container.appendChild(div);
                });
                
            } catch (error) {
                showToast('Search failed', 'error');
            }
        }

        // Toggle sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('sidebarIcon');
            sidebar.classList.toggle('collapsed');
            icon.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        }

        // Toast notifications
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Cmd/Ctrl + S = Save
            if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                e.preventDefault();
                saveFile();
            }
            // Cmd/Ctrl + P = Search
            if ((e.metaKey || e.ctrlKey) && e.key === 'p') {
                e.preventDefault();
                showSearch();
            }
            // Escape = Close modals
            if (e.key === 'Escape') {
                closeDiff();
                hideSearch();
            }
        });

        // Close search when clicking outside
        document.addEventListener('click', (e) => {
            const searchModal = document.getElementById('searchModal');
            if (searchModal.classList.contains('visible') && !searchModal.contains(e.target)) {
                hideSearch();
            }
        });
    </script>
</body>
</html>
