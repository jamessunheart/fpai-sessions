<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Build History - Aria</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --success: #3fb950;
            --danger: #f85149;
            --warning: #d29922;
            --border: #30363d;
            --code-bg: #0d1117;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
        }

        .stat {
            padding: 6px 12px;
            background: var(--bg-secondary);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-weight: 600;
            color: var(--accent);
        }

        /* Filter tabs */
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .filter-tab {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-tab:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .filter-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* Build list */
        .build-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .build-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .build-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .build-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .build-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .build-id {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .build-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-completed {
            background: rgba(63, 185, 80, 0.15);
            color: var(--success);
        }

        .status-failed {
            background: rgba(248, 81, 73, 0.15);
            color: var(--danger);
        }

        .status-needs_approval {
            background: rgba(210, 153, 34, 0.15);
            color: var(--warning);
        }

        .status-queued, .status-building {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent);
        }

        .status-rolled_back {
            background: rgba(139, 148, 158, 0.15);
            color: var(--text-secondary);
        }

        .build-meta {
            display: flex;
            gap: 16px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .build-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .build-changes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .change-tag {
            font-size: 0.7rem;
            padding: 3px 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            color: var(--text-secondary);
        }

        .change-tag.create {
            color: var(--success);
        }

        .change-tag.modify {
            color: var(--warning);
        }

        .change-tag.delete {
            color: var(--danger);
        }

        /* Build details modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 16px;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .diff-view {
            background: var(--code-bg);
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .diff-add {
            color: var(--success);
            background: rgba(63, 185, 80, 0.1);
        }

        .diff-remove {
            color: var(--danger);
            background: rgba(248, 81, 73, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Cost badge */
        .cost-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <span>🔨</span>
                Build History
            </h1>
            <div class="stats">
                <div class="stat">
                    Builds: <span class="stat-value" id="total-builds">-</span>
                </div>
                <div class="stat">
                    Cost: <span class="stat-value" id="total-cost">$-</span>
                </div>
            </div>
        </header>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="completed">Completed</button>
            <button class="filter-tab" data-filter="needs_approval">Pending</button>
            <button class="filter-tab" data-filter="failed">Failed</button>
            <button class="filter-tab" data-filter="rolled_back">Rolled Back</button>
        </div>

        <div class="build-list" id="build-list">
            <div class="loading">
                <div class="spinner"></div>
                Loading builds...
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Build Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Dynamic content -->
            </div>
            <div class="modal-actions" id="modal-actions">
                <!-- Dynamic actions -->
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // State
        let builds = [];
        let currentFilter = 'all';
        let selectedBuild = null;

        // API base URL
        const API_BASE = window.location.origin;

        // Load builds
        async function loadBuilds() {
            try {
                const response = await fetch(`${API_BASE}/build/queue`);
                const data = await response.json();
                
                if (data.success) {
                    builds = data.data.recent_builds || [];
                    updateStats(data.data.status_counts || {});
                    renderBuilds();
                }
            } catch (error) {
                console.error('Failed to load builds:', error);
                document.getElementById('build-list').innerHTML = `
                    <div class="empty-state">
                        <p>Failed to load builds</p>
                        <p style="font-size: 0.8rem; margin-top: 8px;">${error.message}</p>
                    </div>
                `;
            }
        }

        // Load costs
        async function loadCosts() {
            try {
                const response = await fetch(`${API_BASE}/build/costs?days=30`);
                const data = await response.json();
                
                if (data.success && data.data) {
                    document.getElementById('total-cost').textContent = 
                        `$${data.data.total_cost_usd?.toFixed(4) || '0.00'}`;
                }
            } catch (error) {
                console.error('Failed to load costs:', error);
            }
        }

        // Update stats
        function updateStats(counts) {
            const total = Object.values(counts).reduce((a, b) => a + b, 0);
            document.getElementById('total-builds').textContent = total;
        }

        // Render builds
        function renderBuilds() {
            const list = document.getElementById('build-list');
            
            const filtered = currentFilter === 'all' 
                ? builds 
                : builds.filter(b => b.status === currentFilter);
            
            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                        <p>No builds found</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(build => `
                <div class="build-card" onclick="showBuildDetails('${build.id}')">
                    <div class="build-header">
                        <div class="build-title">
                            <span class="build-id">${build.id?.slice(0, 8) || 'N/A'}</span>
                            ${build.title || 'Untitled Build'}
                        </div>
                        <span class="build-status status-${build.status}">${formatStatus(build.status)}</span>
                    </div>
                    <div class="build-meta">
                        <span>👤 ${build.author || 'system'}</span>
                        <span>📁 ${build.scope || 'unknown'}</span>
                        <span>🕐 ${formatDate(build.queued_at)}</span>
                        ${build.actual_cost ? `<span class="cost-badge">$${build.actual_cost.toFixed(4)}</span>` : ''}
                    </div>
                    ${renderChangeTags(build.changes_json)}
                </div>
            `).join('');
        }

        // Render change tags
        function renderChangeTags(changesJson) {
            if (!changesJson) return '';
            
            try {
                const changes = typeof changesJson === 'string' ? JSON.parse(changesJson) : changesJson;
                if (!Array.isArray(changes)) return '';
                
                return `
                    <div class="build-changes">
                        ${changes.slice(0, 5).map(c => `
                            <span class="change-tag ${c.action}">${c.action}: ${c.file_path?.split('/').pop() || 'file'}</span>
                        `).join('')}
                        ${changes.length > 5 ? `<span class="change-tag">+${changes.length - 5} more</span>` : ''}
                    </div>
                `;
            } catch {
                return '';
            }
        }

        // Show build details
        async function showBuildDetails(buildId) {
            selectedBuild = builds.find(b => b.id === buildId);
            if (!selectedBuild) return;

            document.getElementById('modal-title').textContent = selectedBuild.title || 'Build Details';
            
            // Load full details
            let details = selectedBuild;
            try {
                const response = await fetch(`${API_BASE}/build/${buildId}`);
                const data = await response.json();
                if (data.success) details = data.data;
            } catch {}

            // Render body
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <div class="modal-section">
                    <h3>Status</h3>
                    <span class="build-status status-${details.status}">${formatStatus(details.status)}</span>
                </div>
                
                <div class="modal-section">
                    <h3>Details</h3>
                    <p><strong>ID:</strong> ${details.id}</p>
                    <p><strong>Author:</strong> ${details.author}</p>
                    <p><strong>Scope:</strong> ${details.scope}</p>
                    <p><strong>Complexity:</strong> ${details.complexity}</p>
                    <p><strong>Risk:</strong> ${details.risk}</p>
                    <p><strong>Queued:</strong> ${formatDate(details.queued_at)}</p>
                    ${details.completed_at ? `<p><strong>Completed:</strong> ${formatDate(details.completed_at)}</p>` : ''}
                    ${details.error_message ? `<p style="color: var(--danger);"><strong>Error:</strong> ${details.error_message}</p>` : ''}
                </div>
                
                ${renderChangesSection(details.changes_json)}
            `;

            // Render actions
            const actions = document.getElementById('modal-actions');
            actions.innerHTML = '';
            
            if (details.status === 'needs_approval') {
                actions.innerHTML = `
                    <button class="btn btn-primary" onclick="approveBuil('${buildId}')">✅ Approve</button>
                    <button class="btn btn-danger" onclick="rejectBuild('${buildId}')">❌ Reject</button>
                `;
            } else if (details.status === 'completed') {
                actions.innerHTML = `
                    <button class="btn btn-secondary" onclick="rollbackBuild('${buildId}')">⏪ Rollback</button>
                `;
            }
            
            actions.innerHTML += `<button class="btn btn-secondary" onclick="closeModal()">Close</button>`;

            document.getElementById('modal-overlay').classList.add('active');
        }

        // Render changes section
        function renderChangesSection(changesJson) {
            if (!changesJson) return '';
            
            try {
                const changes = typeof changesJson === 'string' ? JSON.parse(changesJson) : changesJson;
                if (!Array.isArray(changes) || changes.length === 0) return '';
                
                return `
                    <div class="modal-section">
                        <h3>Changes (${changes.length})</h3>
                        ${changes.map(c => `
                            <div style="margin-bottom: 16px;">
                                <p><strong>${c.action}:</strong> ${c.file_path}</p>
                                ${c.description ? `<p style="color: var(--text-secondary); font-size: 0.85rem;">${c.description}</p>` : ''}
                                ${c.new_content ? `
                                    <div class="diff-view">
                                        <div class="diff-add">${escapeHtml(c.new_content.slice(0, 500))}${c.new_content.length > 500 ? '...' : ''}</div>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch {
                return '';
            }
        }

        // Actions
        async function approveBuild(buildId) {
            try {
                const response = await fetch(`${API_BASE}/build/${buildId}/approve`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    tg?.showAlert('Build approved!');
                    closeModal();
                    loadBuilds();
                } else {
                    tg?.showAlert(data.detail || 'Failed to approve');
                }
            } catch (error) {
                tg?.showAlert('Error: ' + error.message);
            }
        }

        async function rejectBuild(buildId) {
            try {
                const response = await fetch(`${API_BASE}/build/${buildId}/reject`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason: 'Rejected via dashboard' })
                });
                const data = await response.json();
                if (data.success) {
                    tg?.showAlert('Build rejected');
                    closeModal();
                    loadBuilds();
                }
            } catch (error) {
                tg?.showAlert('Error: ' + error.message);
            }
        }

        async function rollbackBuild(buildId) {
            if (!confirm('Are you sure you want to rollback this build?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/build/${buildId}/rollback`, { method: 'POST' });
                const data = await response.json();
                tg?.showAlert(data.message || (data.success ? 'Rolled back' : 'Failed'));
                closeModal();
                loadBuilds();
            } catch (error) {
                tg?.showAlert('Error: ' + error.message);
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
            selectedBuild = null;
        }

        // Helpers
        function formatStatus(status) {
            const map = {
                'completed': 'Done',
                'failed': 'Failed',
                'needs_approval': 'Pending',
                'queued': 'Queued',
                'building': 'Building',
                'rolled_back': 'Rolled Back',
                'rejected': 'Rejected'
            };
            return map[status] || status;
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            try {
                const date = new Date(dateStr);
                return date.toLocaleString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return dateStr;
            }
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Filter handlers
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                renderBuilds();
            });
        });

        // Close modal on overlay click
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') closeModal();
        });

        // Initialize
        loadBuilds();
        loadCosts();
        
        // Auto-refresh every 30s
        setInterval(() => {
            loadBuilds();
            loadCosts();
        }, 30000);
    </script>
</body>
</html>
