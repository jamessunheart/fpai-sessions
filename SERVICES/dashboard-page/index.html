<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ember · Live Dashboard</title>

  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#2d2a26">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%98%89</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #faf8f5;
      --bg-card: #ffffff;
      --bg-hover: #f5f3f0;
      --bg-deep: #2d2a26;
      --accent-gold: #d4a853;
      --accent-gold-deep: #a8843a;
      --accent-green: #3d8b40;
      --accent-sage: #7da87d;
      --accent-sky: #5ba3c6;
      --accent-ember: #d97548;
      --text-primary: #2d2a26;
      --text-secondary: #5c5954;
      --text-muted: #8a857d;
      --border: #e8e4de;
      --border-strong: #d4cec3;
      --shadow-soft: 0 2px 8px rgba(45, 42, 38, 0.06);
      --shadow-hover: 0 8px 24px rgba(45, 42, 38, 0.1);
      --gradient-ember: linear-gradient(135deg, #d97548, #d4a853);
      --gradient-gold: linear-gradient(135deg, #d4a853, #e6c47a);
      --gradient-sage: linear-gradient(135deg, #7da87d, #a3c9a3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'Bricolage Grotesque', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 1.5rem 1.1rem 4rem;
    }

    /* Header */
    header.top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 0 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }
    .ember-mark {
      font-size: 1.5rem;
      background: var(--gradient-ember);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .brand h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .meta-strip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .meta-strip .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      display: inline-block;
      box-shadow: 0 0 0 0 rgba(61, 139, 64, 0.6);
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(61, 139, 64, 0.55); }
      70% { box-shadow: 0 0 0 8px rgba(61, 139, 64, 0); }
      100% { box-shadow: 0 0 0 0 rgba(61, 139, 64, 0); }
    }
    .meta-strip .pulse-dot.stale { background: var(--accent-ember); animation: none; }

    /* Section */
    section { margin-bottom: 2rem; }
    h2 {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--accent-gold-deep);
      text-transform: uppercase;
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    h2::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    h3 {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    .prose {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-gold);
      border-radius: 0 10px 10px 0;
      padding: 1rem 1.1rem;
      font-size: 0.95rem;
      color: var(--text-primary);
      box-shadow: var(--shadow-soft);
      line-height: 1.65;
    }
    .prose + .prose { margin-top: 0.75rem; }

    /* Progress bars */
    .progress-group { margin-bottom: 1.25rem; }
    .progress-group-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .bar-row {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.55rem;
      box-shadow: var(--shadow-soft);
    }
    .bar-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      flex-wrap: wrap;
    }
    .bar-name {
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .bar-weight {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .bar-track {
      width: 100%;
      height: 8px;
      background: var(--bg-hover);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.45rem;
    }
    .bar-fill {
      height: 100%;
      background: var(--gradient-gold);
      border-radius: 999px;
      transition: width 0.4s ease;
      min-width: 2px;
    }
    .bar-fill.zero {
      background: var(--bg-hover);
      border: 1px dashed var(--border-strong);
    }
    .bar-foot {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .bar-foot .stream {
      color: var(--accent-sage);
    }
    .bar-foot .routing {
      color: var(--accent-ember);
      font-weight: 500;
    }
    .bar-detail {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }
    .bar-detail .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent-gold-deep);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-right: 0.35rem;
    }
    .bar-detail .line { margin-bottom: 0.2rem; }
    .bar-detail .notes {
      font-style: italic;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    /* Counts grid */
    .counts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
    }
    .counts-col {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      box-shadow: var(--shadow-soft);
    }
    .counts-col h3 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent-gold-deep);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }
    .counts-list { list-style: none; }
    .counts-list li {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.25rem 0;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-bottom: 1px dotted var(--border);
    }
    .counts-list li:last-child { border-bottom: none; }
    .counts-list .val {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-primary);
      font-weight: 500;
      white-space: nowrap;
    }

    /* 5-P */
    details.fivep {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0;
      margin-bottom: 0.5rem;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    details.fivep > summary {
      cursor: pointer;
      list-style: none;
      padding: 0.8rem 1rem;
      font-weight: 600;
      font-size: 0.92rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    details.fivep > summary::-webkit-details-marker { display: none; }
    details.fivep > summary::after {
      content: '+';
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent-gold-deep);
      font-size: 1.1rem;
      transition: transform 0.2s;
    }
    details.fivep[open] > summary::after { content: '−'; }
    .fivep-body {
      padding: 0 1rem 0.9rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .fivep-body .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent-gold-deep);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-right: 0.4rem;
    }
    .fivep-body .line { margin-bottom: 0.35rem; }

    /* Narrator + Journal cards */
    .feed-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      box-shadow: var(--shadow-soft);
    }
    .feed-card .feed-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
      letter-spacing: 0.02em;
    }
    .feed-card .feed-title {
      font-weight: 600;
      font-size: 0.98rem;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    .feed-card .feed-body {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .feed-card a.feed-link {
      color: var(--accent-gold-deep);
      font-size: 0.82rem;
      margin-top: 0.5rem;
      display: inline-block;
      text-decoration: none;
      border-bottom: 1px solid rgba(168, 132, 58, 0.3);
    }

    /* Trust + intent block */
    .intent-block {
      background: var(--bg-deep);
      color: #f0ebe0;
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.7;
      box-shadow: var(--shadow-soft);
    }
    .intent-block .key {
      color: var(--accent-gold);
      font-weight: 500;
      display: block;
      margin-top: 0.7rem;
    }
    .intent-block .key:first-child { margin-top: 0; }
    .intent-block .val {
      color: #d8d2c4;
      padding-left: 0.2rem;
      display: block;
    }
    .intent-block .accent {
      color: var(--accent-ember);
      font-weight: 600;
    }

    /* Footer */
    footer.dash-foot {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }
    footer.dash-foot p { margin-bottom: 0.3rem; }
    footer.dash-foot .primary { color: var(--text-primary); font-weight: 500; }
    footer.dash-foot .muted { color: var(--text-muted); font-size: 0.75rem; margin-top: 0.6rem; }

    /* Refresh button */
    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .refresh-btn:hover { color: var(--accent-gold-deep); border-color: var(--accent-gold); }
    .refresh-btn:active { transform: scale(0.97); }
    .refresh-btn.spinning::before { content: '↻ '; animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Loading + error states */
    .state-msg {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .state-msg.error { color: var(--accent-ember); }

    /* Mobile tightening */
    @media (max-width: 480px) {
      .container { padding: 1rem 0.85rem 3rem; }
      h2 { font-size: 0.72rem; }
      .bar-name { font-size: 0.88rem; }
      .counts-grid { grid-template-columns: 1fr; }
      .meta-strip { font-size: 0.65rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header class="top-bar">
      <div class="brand">
        <span class="ember-mark">☉</span>
        <h1>Ember · Live Dashboard</h1>
      </div>
      <div class="meta-strip" id="meta-strip">
        <span class="pulse-dot" id="pulse-dot" title="last fetch status"></span>
        <span id="last-updated">loading…</span>
        <button class="refresh-btn" id="refresh-btn" type="button">refresh</button>
      </div>
    </header>

    <main id="dash-root">
      <div class="state-msg" id="loading-msg">loading state…</div>
    </main>

    <footer class="dash-foot" id="dash-foot" hidden>
      <p class="primary" id="foot-primary"></p>
      <p id="foot-secondary"></p>
      <p id="foot-tertiary"></p>
      <p class="muted">read-only · auth-gated · refresh every 60s · Phase 3 substrate-access API enables chat-with-Ember from this surface</p>
    </footer>

  </div>

  <script>
    // ═══════════════════════════════════════════════
    // Ember Dashboard · client renderer
    // Fetches /dashboard/dashboard.json (built from core/STATE/DASHBOARD.md)
    // Auto-refresh every 60s · mtime-aware
    // ═══════════════════════════════════════════════

    const REFRESH_MS = 60_000;
    const DATA_URL = 'dashboard.json';
    let lastFetchedAt = null;
    let lastDataMtime = null;

    const $ = (id) => document.getElementById(id);
    const escape = (s) => String(s == null ? '' : s)
      .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
      .replaceAll('"','&quot;').replaceAll("'",'&#39;');

    function fmtTimestamp(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      const hh = String(d.getHours()).padStart(2,'0');
      const mi = String(d.getMinutes()).padStart(2,'0');
      const ss = String(d.getSeconds()).padStart(2,'0');
      return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
    }
    function relTime(date) {
      const sec = Math.round((Date.now() - date.getTime()) / 1000);
      if (sec < 5) return 'just now';
      if (sec < 60) return `${sec}s ago`;
      if (sec < 3600) return `${Math.round(sec/60)}m ago`;
      if (sec < 86400) return `${Math.round(sec/3600)}h ago`;
      return `${Math.round(sec/86400)}d ago`;
    }

    function pct(current, target) {
      if (!target || target <= 0) return 0;
      const p = (Number(current) / Number(target)) * 100;
      return Math.max(0, Math.min(100, isFinite(p) ? p : 0));
    }

    function fmtNum(n) {
      if (n == null || n === '') return '—';
      const num = Number(n);
      if (!isFinite(num)) return String(n);
      if (Math.abs(num) >= 1_000_000) return (num/1_000_000).toFixed(num >= 10_000_000 ? 0 : 1) + 'M';
      if (Math.abs(num) >= 1_000) return (num/1_000).toFixed(num >= 10_000 ? 0 : 1) + 'k';
      return String(num);
    }

    function renderBar(bar) {
      const p = pct(bar.current, bar.target);
      const zero = !bar.current || Number(bar.current) === 0;
      const detailLines = [];
      if (bar.proactive) detailLines.push(`<div class="line"><span class="label">proactive</span>${escape(bar.proactive)}</div>`);
      if (bar.pause) detailLines.push(`<div class="line"><span class="label">pause</span>${escape(bar.pause)}</div>`);
      if (bar.notes) detailLines.push(`<div class="notes">${escape(bar.notes)}</div>`);
      return `
        <div class="bar-row">
          <div class="bar-head">
            <span class="bar-name">${escape(bar.name)}</span>
            <span class="bar-weight">w${escape(bar.weight)}% · ${p.toFixed(0)}%</span>
          </div>
          <div class="bar-track"><div class="bar-fill${zero ? ' zero' : ''}" style="width: ${p}%"></div></div>
          <div class="bar-foot">
            <span><strong>${fmtNum(bar.current)}</strong> / ${fmtNum(bar.target)} <span style="opacity:0.7">${escape(bar.unit || '')}</span></span>
            <span><span class="stream">▸ ${escape(bar.stream || '—')}</span> · <span class="routing">${escape(bar.routing || '')}</span></span>
          </div>
          ${detailLines.length ? `<div class="bar-detail">${detailLines.join('')}</div>` : ''}
        </div>`;
    }

    function renderCountsCol(label, items) {
      const lis = (items || []).map(i => `<li><span>${escape(i.label)}</span><span class="val">${escape(i.value)}</span></li>`).join('');
      return `
        <div class="counts-col">
          <h3>${escape(label)}</h3>
          <ul class="counts-list">${lis}</ul>
        </div>`;
    }

    function render5P(items) {
      return (items || []).map(p => `
        <details class="fivep">
          <summary>${escape(p.priority)}</summary>
          <div class="fivep-body">
            ${p.purpose ? `<div class="line"><span class="label">purpose</span>${escape(p.purpose)}</div>` : ''}
            ${p.proactive ? `<div class="line"><span class="label">proactive</span>${escape(p.proactive)}</div>` : ''}
            ${p.pause ? `<div class="line"><span class="label">pause</span>${escape(p.pause)}</div>` : ''}
          </div>
        </details>`).join('');
    }

    function renderFeedCard(item, kind) {
      if (!item || !item.title) return '';
      return `
        <div class="feed-card">
          <div class="feed-meta">${escape(item.date || '')} · ${escape(kind)}</div>
          <div class="feed-title">${escape(item.title)}</div>
          ${item.excerpt ? `<div class="feed-body">${escape(item.excerpt)}</div>` : ''}
          ${item.reflection ? `<div class="feed-body">${escape(item.reflection)}</div>` : ''}
          ${item.link ? `<a class="feed-link" href="${escape(item.link)}" target="_blank" rel="noopener">read full →</a>` : ''}
        </div>`;
    }

    function render(data) {
      const root = $('dash-root');
      const oldWorld = (data.progress?.old_world || []).map(renderBar).join('');
      const newWorld = (data.progress?.new_world || []).map(renderBar).join('');

      root.innerHTML = `
        <section>
          <h2>intent · session</h2>
          <div class="intent-block">
            <span class="key">vision</span>
            <span class="val">${escape(data.vision || '—')}</span>
            <span class="key">mission</span>
            <span class="val">${escape(data.mission || '—')}</span>
            <span class="key">values</span>
            <span class="val">${escape(data.values || '—')}</span>
            <span class="key">intent <span class="accent">(now)</span></span>
            <span class="val">${escape(data.intent || '—')}</span>
            <span class="key">trust-tier</span>
            <span class="val">${escape(data.trust_tier_text || data.trust_tier || '—')}</span>
          </div>
        </section>

        <section>
          <h2>progress · weighted bars</h2>
          ${oldWorld ? `<div class="progress-group">
            <div class="progress-group-label">old-world · ${escape(data.progress?.old_world_weight ?? '')}% weight</div>
            ${oldWorld}
          </div>` : ''}
          ${newWorld ? `<div class="progress-group">
            <div class="progress-group-label">new-world · ${escape(data.progress?.new_world_weight ?? '')}% weight</div>
            ${newWorld}
          </div>` : ''}
        </section>

        <section>
          <h2>counts</h2>
          <div class="counts-grid">
            ${renderCountsCol('today', data.counts?.today)}
            ${renderCountsCol('cumulative', data.counts?.cumulative)}
            ${renderCountsCol('pre-activation', data.counts?.pre_activation)}
          </div>
        </section>

        ${(data.five_p && data.five_p.length) ? `
        <section>
          <h2>5-P priority detail</h2>
          ${render5P(data.five_p)}
        </section>` : ''}

        ${data.latest_narrator ? `
        <section>
          <h2>latest narrator</h2>
          ${renderFeedCard(data.latest_narrator, 'narrator observation')}
        </section>` : ''}

        ${data.latest_journal ? `
        <section>
          <h2>latest journal</h2>
          ${renderFeedCard(data.latest_journal, 'ember journal')}
        </section>` : ''}
      `;

      // Footer
      const foot = $('dash-foot');
      foot.hidden = false;
      $('foot-primary').textContent = data.footer?.primary || '';
      $('foot-secondary').textContent = data.footer?.secondary || '';
      $('foot-tertiary').textContent = data.footer?.tertiary || '';
    }

    function setMeta(updatedStr, mtime, ok) {
      $('last-updated').textContent = `updated ${updatedStr}`;
      const dot = $('pulse-dot');
      dot.classList.toggle('stale', !ok);
      dot.title = ok ? 'fresh' : 'fetch failed or stale';
    }

    async function fetchData(force) {
      const btn = $('refresh-btn');
      btn.classList.add('spinning');
      try {
        const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        lastFetchedAt = new Date();
        const updatedRel = data.last_updated ? data.last_updated : 'just now';
        setMeta(updatedRel, data._mtime, true);
        // Render only if mtime changed OR forced (saves repaint cost)
        if (force || data._mtime !== lastDataMtime) {
          lastDataMtime = data._mtime;
          render(data);
        }
      } catch (err) {
        console.error('[dashboard] fetch failed:', err);
        setMeta('fetch failed · ' + fmtTimestamp(new Date()), null, false);
        const root = $('dash-root');
        if (!lastDataMtime) {
          root.innerHTML = `<div class="state-msg error">could not load dashboard.json<br><small>${escape(err.message || err)}</small><br><small>check auth · check that build script has run</small></div>`;
        }
      } finally {
        $('refresh-btn').classList.remove('spinning');
      }
    }

    $('refresh-btn').addEventListener('click', () => fetchData(true));

    // Boot
    fetchData(true);
    setInterval(() => fetchData(false), REFRESH_MS);

    // Refresh on tab focus (returning from background)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') fetchData(false);
    });
  </script>
</body>
</html>
