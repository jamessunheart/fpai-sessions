<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliates Admin · Zen Village</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #fff;
    --ink: #2a2520;
    --muted: #7a7066;
    --accent: #4a7c59;
    --accent-dark: #355a40;
    --line: #e6e0d6;
    --warn: #c97c2d;
    --good: #4a7c59;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 0; }
  header { background: var(--accent); color: #fff; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 1.3rem; font-weight: 600; }
  .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .card h2 { margin: 0 0 1rem; font-size: 1.05rem; font-weight: 600; }
  .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }
  label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select, textarea { width: 100%; padding: 0.55rem 0.7rem; border: 1px solid var(--line); border-radius: 6px; font-size: 0.95rem; background: #fff; color: var(--ink); font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: #fff; border: 0; padding: 0.55rem 1rem; border-radius: 6px; font-size: 0.92rem; cursor: pointer; font-weight: 500; }
  button:hover { background: var(--accent-dark); }
  button.secondary { background: #ede5d6; color: var(--ink); }
  button.danger { background: #b94a3a; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.55rem 0.5rem; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; }
  .stat { background: var(--bg); padding: 0.85rem; border-radius: 8px; text-align: center; }
  .stat .num { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.25rem; }
  .pill { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
  .pill.active { background: #d8ecdf; color: var(--good); }
  .pill.paused { background: #f3eed8; color: var(--warn); }
  .pill.revoked { background: #f3d8d8; color: #a83333; }
  .pill.pending { background: #f3eed8; color: var(--warn); }
  .pill.paid { background: #d8ecdf; color: var(--good); }
  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--ink); color: #fff; padding: 0.8rem 1.2rem; border-radius: 8px; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
  .toast.show { opacity: 1; }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 60vh; }
  .login-card { max-width: 400px; width: 100%; }
  .copy-link { font-family: monospace; font-size: 0.82rem; color: var(--muted); cursor: pointer; }
  .copy-link:hover { color: var(--accent); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🌿 Affiliates Admin</h1>
  <div id="header-right"></div>
</header>

<div id="app"></div>

<div id="toast" class="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
let TOKEN = localStorage.getItem('zv_affiliates_token') || '';
function toast(msg, ms=2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}
async function api(path, opts={}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers||{}) };
  if (TOKEN) headers['x-admin-token'] = TOKEN;
  const r = await fetch('/api/affiliates' + path, { ...opts, headers });
  if (r.status === 401) { localStorage.removeItem('zv_affiliates_token'); TOKEN=''; render(); throw new Error('unauthorized'); }
  if (!r.ok) {
    const err = await r.json().catch(()=>({detail: r.statusText}));
    throw new Error(err.detail || 'request failed');
  }
  return r.json();
}
function copy(text) {
  navigator.clipboard.writeText(text).then(()=>toast('Copied: ' + text.substring(0, 60)));
}

function loginScreen() {
  $('#app').innerHTML = `
    <div class="container login-wrap">
      <div class="card login-card">
        <h2>Sign in</h2>
        <p style="color:var(--muted); font-size:0.9rem;">Enter the admin token (from <code>ZV_AFFILIATES_ADMIN_TOKEN</code>).</p>
        <input id="token-input" type="password" placeholder="Admin token" />
        <div style="margin-top:0.75rem;"><button id="login-btn">Continue</button></div>
      </div>
    </div>`;
  $('#login-btn').onclick = async () => {
    TOKEN = $('#token-input').value.trim();
    if (!TOKEN) return;
    try {
      await api('/stats');
      localStorage.setItem('zv_affiliates_token', TOKEN);
      render();
    } catch(e) { toast('Invalid token'); TOKEN=''; }
  };
  $('#token-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('#login-btn').click(); });
}

async function dashboard() {
  $('#header-right').innerHTML = `<button class="secondary" id="logout">Sign out</button>`;
  $('#logout').onclick = () => { localStorage.removeItem('zv_affiliates_token'); TOKEN=''; render(); };

  $('#app').innerHTML = `
    <div class="container">
      <div class="card">
        <h2>📊 Stats</h2>
        <div class="stats-grid" id="stats"></div>
      </div>

      <div class="card">
        <h2>⚙️ Commission Config</h2>
        <div id="config-form"></div>
      </div>

      <div class="grid-2">
        <div class="card">
          <h2>➕ New Partner</h2>
          <div class="row">
            <div><label>Name</label><input id="np-name" /></div>
            <div><label>Email</label><input id="np-email" type="email" /></div>
          </div>
          <div class="row" style="margin-top:0.5rem;">
            <div><label>Phone</label><input id="np-phone" /></div>
            <div><label>Payout Method</label><select id="np-payout"><option value="">(default)</option><option value="credits">Zen Credits</option><option value="cash">Cash</option><option value="both">Either</option></select></div>
          </div>
          <div style="margin-top:0.5rem;"><label>Notes</label><textarea id="np-notes" rows="2"></textarea></div>
          <div style="margin-top:0.75rem;"><button id="np-create">Create Partner</button></div>
        </div>

        <div class="card">
          <h2>👥 Partners</h2>
          <table><thead><tr><th>Code</th><th>Name</th><th>Refs</th><th>Pending</th><th>Status</th><th></th></tr></thead><tbody id="partners-body"></tbody></table>
        </div>
      </div>

      <div class="card">
        <h2>💰 Pending Commissions</h2>
        <table><thead><tr><th>Partner</th><th>Type</th><th>Amount</th><th>Commission</th><th>Source</th><th>Date</th><th></th></tr></thead><tbody id="pending-body"></tbody></table>
      </div>

      <div class="card">
        <h2>✅ Recent Paid</h2>
        <table><thead><tr><th>Partner</th><th>Type</th><th>Amount</th><th>Commission</th><th>Paid At</th></tr></thead><tbody id="paid-body"></tbody></table>
      </div>
    </div>`;

  await Promise.all([loadStats(), loadConfig(), loadPartners(), loadCommissions()]);
  $('#np-create').onclick = createPartner;
}

async function loadStats() {
  try {
    const s = await api('/stats');
    $('#stats').innerHTML = `
      <div class="stat"><div class="num">${s.active_partners}/${s.total_partners}</div><div class="lbl">Active Partners</div></div>
      <div class="stat"><div class="num">${s.total_visits}</div><div class="lbl">Tracked Visits</div></div>
      <div class="stat"><div class="num">${s.total_conversions}</div><div class="lbl">Conversions</div></div>
      <div class="stat"><div class="num">$${s.total_booking_volume.toFixed(0)}</div><div class="lbl">Sales Driven</div></div>
      <div class="stat"><div class="num">$${s.pending_payouts.toFixed(2)}</div><div class="lbl">Pending Payouts</div></div>
      <div class="stat"><div class="num">$${s.total_commission_paid.toFixed(2)}</div><div class="lbl">Paid Out</div></div>`;
  } catch(e) { toast('Stats: ' + e.message); }
}

async function loadConfig() {
  try {
    const cfg = await api('/config');
    const types = ['stay','retreat','day_pass','event','credits','default'];
    const rateInputs = types.map(t => `
      <div><label>${t} %</label><input id="rate-${t}" type="number" step="0.5" min="0" max="100" value="${(cfg.rates[t]*100).toFixed(1)}" /></div>
    `).join('');
    $('#config-form').innerHTML = `
      <div class="row">${rateInputs}</div>
      <div class="row" style="margin-top:0.75rem;">
        <div><label>Cookie Days</label><input id="cfg-cookie" type="number" value="${cfg.cookie_days}" /></div>
        <div><label>Default Payout</label><select id="cfg-payout">
          <option value="credits"${cfg.default_payout_method==='credits'?' selected':''}>Zen Credits</option>
          <option value="cash"${cfg.default_payout_method==='cash'?' selected':''}>Cash</option>
          <option value="both"${cfg.default_payout_method==='both'?' selected':''}>Either</option></select></div>
        <div><label>Min Payout</label><input id="cfg-min" type="number" step="0.01" value="${cfg.min_payout_amount}" /></div>
        <div><label>Site Base URL</label><input id="cfg-base" value="${cfg.site_base_url}" /></div>
      </div>
      <div style="margin-top:0.75rem;"><button id="save-config">Save Config</button></div>`;
    $('#save-config').onclick = async () => {
      const rates = {};
      types.forEach(t => { rates[t] = parseFloat($('#rate-'+t).value)/100; });
      try {
        await api('/config', { method: 'PUT', body: JSON.stringify({
          rates,
          cookie_days: parseInt($('#cfg-cookie').value),
          default_payout_method: $('#cfg-payout').value,
          min_payout_amount: parseFloat($('#cfg-min').value),
          site_base_url: $('#cfg-base').value.trim(),
        }) });
        toast('Config saved');
      } catch(e) { toast('Save failed: ' + e.message); }
    };
  } catch(e) { toast('Config: ' + e.message); }
}

async function loadPartners() {
  try {
    const { partners } = await api('/partners');
    $('#partners-body').innerHTML = partners.map(p => `
      <tr>
        <td><span class="copy-link" onclick="copy('https://zenvillagecr.com/?ref=${p.code}')">${p.code}</span></td>
        <td>${p.name}</td>
        <td>${p.total_referrals||0}</td>
        <td>$${(p.pending_payout||0).toFixed(2)}</td>
        <td><span class="pill ${p.status||'active'}">${p.status||'active'}</span></td>
        <td>
          ${p.pending_payout > 0 ? `<button onclick="payoutPartner('${p.code}')">Pay All</button>` : ''}
          ${(p.status||'active')==='active' ? `<button class="secondary" onclick="updatePartner('${p.code}','paused')">Pause</button>` : `<button class="secondary" onclick="updatePartner('${p.code}','active')">Resume</button>`}
        </td>
      </tr>`).join('') || '<tr><td colspan="6" style="text-align:center; color:var(--muted);">No partners yet — create one above.</td></tr>';
  } catch(e) { toast('Partners: ' + e.message); }
}

async function loadCommissions() {
  try {
    const [pending, paid] = await Promise.all([
      api('/commissions?status=pending&limit=50'),
      api('/commissions?status=paid&limit=20'),
    ]);
    $('#pending-body').innerHTML = pending.commissions.map(c => `
      <tr>
        <td>${c.partner_code}</td>
        <td>${c.booking_type}</td>
        <td>$${c.booking_amount.toFixed(2)}</td>
        <td><strong>$${c.commission_amount.toFixed(2)}</strong></td>
        <td style="font-family:monospace; font-size:0.8rem;">${c.source_id||'—'}</td>
        <td style="font-size:0.8rem;">${(c.timestamp||'').substring(0,10)}</td>
        <td><button onclick="markPaid('${c.id}')">Mark Paid</button></td>
      </tr>`).join('') || '<tr><td colspan="7" style="text-align:center; color:var(--muted);">No pending commissions.</td></tr>';
    $('#paid-body').innerHTML = paid.commissions.map(c => `
      <tr>
        <td>${c.partner_code}</td>
        <td>${c.booking_type}</td>
        <td>$${c.booking_amount.toFixed(2)}</td>
        <td>$${c.commission_amount.toFixed(2)}</td>
        <td style="font-size:0.8rem;">${(c.paid_at||'').substring(0,10)}</td>
      </tr>`).join('') || '<tr><td colspan="5" style="text-align:center; color:var(--muted);">None yet.</td></tr>';
  } catch(e) { toast('Commissions: ' + e.message); }
}

async function createPartner() {
  const name = $('#np-name').value.trim();
  const email = $('#np-email').value.trim();
  if (!name || !email) return toast('Name and email required');
  try {
    const r = await api('/partners', { method: 'POST', body: JSON.stringify({
      name, email,
      phone: $('#np-phone').value.trim(),
      payout_method: $('#np-payout').value || null,
      notes: $('#np-notes').value.trim(),
    }) });
    toast('Created ' + r.partner.code + ' — link: ' + r.referral_link);
    ['#np-name','#np-email','#np-phone','#np-notes'].forEach(s => $(s).value='');
    await loadPartners(); await loadStats();
  } catch(e) { toast('Create failed: ' + e.message); }
}

async function markPaid(id) {
  if (!confirm('Mark commission '+id+' as paid?')) return;
  try {
    await api('/payout/'+id, { method: 'POST' });
    toast('Marked paid');
    await Promise.all([loadCommissions(), loadPartners(), loadStats()]);
  } catch(e) { toast('Failed: ' + e.message); }
}
async function payoutPartner(code) {
  if (!confirm('Pay all pending commissions for '+code+'?')) return;
  try {
    const r = await api('/payout/bulk?partner_code='+encodeURIComponent(code), { method: 'POST' });
    toast(`Paid ${r.paid_count} commissions ($${r.total_paid.toFixed(2)})`);
    await Promise.all([loadCommissions(), loadPartners(), loadStats()]);
  } catch(e) { toast('Failed: ' + e.message); }
}
async function updatePartner(code, status) {
  try {
    await api('/partners/'+code, { method: 'PATCH', body: JSON.stringify({ status }) });
    toast('Partner '+status);
    await loadPartners();
  } catch(e) { toast('Failed: ' + e.message); }
}
window.copy = copy; window.markPaid = markPaid; window.payoutPartner = payoutPartner; window.updatePartner = updatePartner;

function render() { TOKEN ? dashboard() : loginScreen(); }
render();
</script>
</body>
</html>
