<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Items · Zen Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300..700&family=Manrope:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4ECDC;--bg-soft:#ECE1CB;--ink:#1F1A14;--ink-soft:#4A3F32;--moss:#3A4A2E;--clay:#B8553A;--gold:#C8924B;--rule:#2A2018;--serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5}
.page{max-width:1200px;margin:0 auto;padding:32px 24px}
h1{font-family:var(--serif);font-weight:300;font-size:36px;margin-bottom:6px}
h1 em{font-style:italic;color:var(--moss)}
.lead{color:var(--ink-soft);margin-bottom:24px}
.token-row{display:flex;gap:10px;margin-bottom:20px;align-items:center}
.token-row input{flex:1;padding:10px 14px;border:1px solid var(--rule);border-radius:8px;background:transparent;font-family:var(--sans)}
button{font-family:var(--sans);font-weight:600;padding:10px 18px;border:1px solid var(--rule);background:var(--ink);color:var(--bg);border-radius:999px;cursor:pointer;font-size:13px}
button.ghost{background:transparent;color:var(--ink)}
.actions-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.item{background:#fff;border:1px solid rgba(42,32,24,.18);border-radius:10px;padding:18px;text-align:center}
.item-emoji{font-size:32px;margin-bottom:6px}
.item-name{font-family:var(--serif);font-size:18px;margin-bottom:4px}
.item-price{font-family:var(--serif);font-weight:500;color:var(--moss)}
.item-cat{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.qr{margin-top:14px;padding-top:14px;border-top:1px solid rgba(42,32,24,.15)}
.qr img{width:140px;height:140px}
.qr-link{font-size:11px;color:var(--ink-soft);word-break:break-all;display:block;margin-top:6px}
.print-btn{margin-top:8px;font-size:11px;padding:6px 12px}
.empty{text-align:center;padding:40px;color:var(--ink-soft)}

@media print{
  .actions-bar,.token-row,h1+.lead,h1,.print-btn,button{display:none !important}
  body{background:white}
  .grid{grid-template-columns:repeat(2,1fr);gap:24px}
  .item{break-inside:avoid;page-break-inside:avoid;border:1px dashed #444}
}
</style>
</head>
<body>
<div class="page">
  <h1>Admin · <em>Items</em></h1>
  <p class="lead">Print this page for QR signage at the Zen Store.</p>

  <div class="token-row">
    <input id="token" type="password" placeholder="X-Admin-Token (only needed for fetching from non-public endpoints)" autocomplete="off">
    <button id="save-token" class="ghost">Save token</button>
  </div>

  <div class="actions-bar">
    <div>
      <a href="/store" class="ghost" style="font-size:13px;padding:8px 14px;border:1px solid var(--rule);border-radius:999px;text-decoration:none;color:var(--ink)">View store →</a>
      <a href="/menu" class="ghost" style="font-size:13px;padding:8px 14px;border:1px solid var(--rule);border-radius:999px;text-decoration:none;color:var(--ink);margin-left:6px">View menu →</a>
    </div>
    <button onclick="window.print()">🖨 Print QR sheet</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No items yet. Add items via the Zen Pass admin.</div>
</div>

<script>
const $ = (id)=>document.getElementById(id);
const tk = () => localStorage.getItem('zv_admin_token') || '';
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

$('token').value = tk();
$('save-token').addEventListener('click', () => {
  const v = $('token').value.trim();
  if (v) localStorage.setItem('zv_admin_token', v);
});

async function load(){
  const r = await fetch('/api/wallet/items?event_id=default');
  const d = await r.json();
  const items = d.items || [];
  if (!items.length){ $('empty').style.display='block'; return; }
  $('grid').innerHTML = items.map(it => `
    <div class="item">
      ${it.emoji ? `<div class="item-emoji">${escapeHtml(it.emoji)}</div>` : ''}
      <div class="item-name">${escapeHtml(it.name)}</div>
      <div class="item-price">${(+it.price_zc).toFixed(2).replace(/\.00$/,'')} ZC</div>
      <div class="item-cat">${escapeHtml(it.category || 'general')}</div>
      <div class="qr">
        <img src="/api/wallet/qr/buy/${encodeURIComponent(it.id)}?size=10" alt="QR for ${escapeHtml(it.name)}">
        <span class="qr-link">${escapeHtml(it.buy_url || '')}</span>
      </div>
    </div>
  `).join('');
}
load();
</script>
</body>
</html>
