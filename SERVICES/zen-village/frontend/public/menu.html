<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen Menu · Zen Village</title>
<meta name="description" content="The Zen menu — tea, kombucha, plant medicine, sound baths. Scan, sip, sit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4ECDC;--bg-soft:#ECE1CB;--ink:#1F1A14;--ink-soft:#4A3F32;--moss:#3A4A2E;--clay:#B8553A;--gold:#C8924B;--rule:#2A2018;--serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55}
a{color:inherit;text-decoration:none}
.page{max-width:680px;margin:0 auto;padding:36px 24px}
.brand{font-family:var(--serif);text-align:center;margin-bottom:8px;font-size:22px}
.brand em{font-style:italic;color:var(--moss)}
.title{font-family:var(--serif);font-size:48px;text-align:center;font-weight:300;letter-spacing:-.02em;margin-bottom:8px}
.title em{font-style:italic;color:var(--moss)}
.lead{text-align:center;font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:16px;margin-bottom:32px}
.balance-link{display:block;text-align:center;margin-bottom:28px;font-size:13px;padding:10px 18px;border:1px solid var(--rule);border-radius:999px;background:var(--bg-soft);max-width:300px;margin-left:auto;margin-right:auto}
.cat{margin-bottom:36px}
.cat-title{font-family:var(--serif);font-size:22px;letter-spacing:.04em;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(42,32,24,.1);gap:14px}
.row:last-child{border-bottom:none}
.row-name{font-family:var(--serif);font-size:18px}
.row-emoji{display:inline-block;margin-right:6px}
.row-desc{font-size:13px;color:var(--ink-soft);margin-top:2px}
.row-price{font-family:var(--serif);font-size:18px;font-weight:500;color:var(--moss);white-space:nowrap}
.row-buy{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--clay);font-weight:700;margin-top:4px;text-align:right}
.empty{text-align:center;padding:48px 20px;color:var(--ink-soft)}
@media(max-width:480px){.title{font-size:36px}}
</style>
</head>
<body>
<div class="page">
  <div class="brand"><a href="/">Zen <em>Village</em></a></div>
  <div class="title">Zen <em>Menu</em></div>
  <div class="lead">Scan, sip, sit.</div>

  <a class="balance-link" href="/wallet" id="balance-link">Sign in to your Wallet →</a>

  <div id="menu"></div>
  <div class="empty" id="empty" style="display:none">
    <p>Menu items appear here once added. <a href="/wallet" style="color:var(--clay);font-weight:600">Open your wallet →</a></p>
  </div>
</div>

<script>
const fmtZC = (n) => `${(+n).toFixed(2).replace(/\.00$/,'')} ZC`;
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function loadAuth(){
  try {
    const r = await fetch('/api/wallet/me', {credentials:'same-origin'});
    if (r.ok){
      const me = await r.json();
      document.getElementById('balance-link').innerHTML = `${escapeHtml(me.email)} · <strong>${fmtZC(me.balance_zc)}</strong>`;
    }
  } catch(e){}
}

async function loadMenu(){
  const r = await fetch('/api/wallet/items?event_id=default');
  const d = await r.json();
  const items = d.items || [];
  if (!items.length){ document.getElementById('empty').style.display='block'; return; }
  const byCat = {};
  for (const it of items){ const c = it.category || 'general'; (byCat[c] = byCat[c] || []).push(it); }
  const html = Object.keys(byCat).sort().map(cat => {
    const rows = byCat[cat].map(it => `
      <a class="row" href="/buy?item=${encodeURIComponent(it.id)}">
        <div>
          <div class="row-name">${it.emoji ? `<span class="row-emoji">${escapeHtml(it.emoji)}</span>` : ''}${escapeHtml(it.name)}</div>
          ${it.description ? `<div class="row-desc">${escapeHtml(it.description)}</div>` : ''}
        </div>
        <div>
          <div class="row-price">${fmtZC(it.price_zc)}</div>
          <span class="row-buy">Tap to buy →</span>
        </div>
      </a>
    `).join('');
    const heading = cat.charAt(0).toUpperCase() + cat.slice(1);
    return `<div class="cat"><div class="cat-title">${escapeHtml(heading)}</div>${rows}</div>`;
  }).join('');
  document.getElementById('menu').innerHTML = html;
}

loadAuth(); loadMenu();
</script>
</body>
</html>
