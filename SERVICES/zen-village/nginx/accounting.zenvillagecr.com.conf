# /etc/nginx/sites-available/accounting.zenvillagecr.com.conf
#
# Password-protected admin subdomain for browsing accounting receipts captured
# by the Telegram bot's /acct lane. Two layers of auth:
#
#   1. Nginx basic-auth (htpasswd) — single shared password, browser-cached.
#   2. After basic-auth passes, nginx injects X-Admin-Token so the FastAPI
#      backend's require_admin check still passes. If basic-auth is ever
#      misconfigured, the API stays gated.
#
# Setup once on the host (see docs/zen-village/runbook/receipts_admin_setup.md):
#   apt-get install -y apache2-utils
#   htpasswd -B -c /etc/nginx/.htpasswd-accounting admin
#   chmod 640 /etc/nginx/.htpasswd-accounting
#   chown root:www-data /etc/nginx/.htpasswd-accounting
#
# The X-Admin-Token value is read from /etc/nginx/conf.d/zv-admin-token.conf
# (defined via `map $host $zv_admin_token { default "<token>"; }` so it lives
# in the http context). See docs/zen-village/runbook/receipts_admin_setup.md.
# This file stays in source control without the secret in it.

server {
    listen 80;
    listen [::]:80;
    server_name accounting.zenvillagecr.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name accounting.zenvillagecr.com;

    # SSL — managed by certbot. Run:
    #   certbot --nginx -d accounting.zenvillagecr.com
    # which will inject ssl_certificate / ssl_certificate_key directives here.

    # Logging
    access_log /var/log/nginx/accounting.access.log;
    error_log  /var/log/nginx/accounting.error.log;

    # Hardening
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25M;

    # === Basic auth gate — applies to ALL locations on this server ===
    auth_basic "Zen Village Accounting";
    auth_basic_user_file /etc/nginx/.htpasswd-accounting;

    # === Static admin page ===
    # The page lives in zen-village's frontend; the FastAPI service serves it
    # at /admin/receipts. Map the subdomain root and /index → that route.
    location = / {
        proxy_pass http://127.0.0.1:8770/admin/receipts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No X-Admin-Token here — the static page itself doesn't need it.
    }
    location = /index { return 301 /; }

    # === Admin API (token-injected) ===
    location /api/admin/receipts {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject the admin token AFTER basic-auth has validated.
        # $zv_admin_token is defined in /etc/nginx/conf.d/zv-admin-token.conf.
        proxy_set_header X-Admin-Token $zv_admin_token;

        # Receipt files can be a few MB.
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Health check (no auth needed for monitoring; basic-auth bypass via location override)
    location = /healthz {
        auth_basic off;
        proxy_pass http://127.0.0.1:8770/health;
        proxy_set_header Host $host;
    }

    # Catch-all: deny anything else on this subdomain — it's only for receipts.
    location / {
        return 404;
    }
}
