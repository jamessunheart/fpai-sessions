# === Full Potential Concierge (fullpotential.ai) ===
# Include from the 443 server block: include /etc/nginx/snippets/concierge.conf;

# Health
location = /concierge/health {
    default_type application/json;
    return 200 '{"status":"ok","service":"concierge"}';
}

# --- Next.js UIs (production: next start on 3100 / 3101) ---
# Match with and without trailing slash (avoid redirect loops with Next basePath).
location = /concierge/agents {
    proxy_pass http://127.0.0.1:3100;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}
location ^~ /concierge/agents/ {
    proxy_pass http://127.0.0.1:3100;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}
location = /concierge/client {
    proxy_pass http://127.0.0.1:3101;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}
location ^~ /concierge/client/ {
    proxy_pass http://127.0.0.1:3101;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}

# --- Voice router (Twilio inbound + status webhooks) ---
location /concierge/twilio/ {
    proxy_pass http://127.0.0.1:8822/twilio/;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}

# --- Voice router (Twilio Media Stream WebSocket) ---
location = /concierge/media {
    proxy_pass http://127.0.0.1:8822/media;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# --- Tenant API surfaces (stable public URLs) ---
location /concierge/onboarding/ {
    proxy_pass http://127.0.0.1:8820/onboarding/;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}
location /concierge/admin-sms/ {
    proxy_pass http://127.0.0.1:8820/admin-sms/;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}

# --- Handoff broker: agent WebSocket (must be before generic /handoff/) ---
location ~ "^/concierge/api/handoff/(agents/[^/]+/ws)$" {
    proxy_pass http://127.0.0.1:8821/$1$is_args$args;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# --- Internal-ish APIs (still public; auth at app layer) ---
location /concierge/api/tenant/ {
    proxy_pass http://127.0.0.1:8820/;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}
location /concierge/api/handoff/ {
    proxy_pass http://127.0.0.1:8821/;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}
location /concierge/api/voice/ {
    proxy_pass http://127.0.0.1:8822/;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}
location /concierge/api/outbound/ {
    proxy_pass http://127.0.0.1:8823/;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}
location /concierge/api/compliance/ {
    proxy_pass http://127.0.0.1:8824/;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}
location /concierge/api/skills/ {
    proxy_pass http://127.0.0.1:8825/;
    include /etc/nginx/snippets/concierge-proxy-headers.conf;
}
