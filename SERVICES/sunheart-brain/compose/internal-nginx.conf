# Sunheart Brain — internal nginx (inside docker stack)
#
# Hostside nginx (the Secondary server's /etc/nginx) terminates TLS for
# brain.sunheart.com and forwards to 127.0.0.1:28080 (which is THIS nginx
# binding). This inner nginx then routes between the AppFlowy subservices.
#
# Mirrors the official AppFlowy Cloud nginx.conf, adapted for the sh-brain
# container names.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream appflowy_cloud_upstream { server appflowy_cloud:8000; }
    upstream gotrue_upstream         { server gotrue:9999;          }
    upstream admin_upstream          { server admin_frontend:3000;  }
    upstream minio_upstream          { server minio:9000;           }
    upstream web_upstream            { server appflowy_web:80;      }

    server {
        listen 80;

        # AppFlowy API
        location /api {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://appflowy_cloud_upstream;
        }

        # WebSocket (collab sync)
        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_pass http://appflowy_cloud_upstream;
        }

        # GoTrue auth (renamed /gotrue → /)
        location /gotrue/ {
            proxy_set_header Host $host;
            proxy_pass http://gotrue_upstream/;
        }

        # Admin console
        location /console {
            proxy_set_header Host $host;
            proxy_pass http://admin_upstream;
        }

        # MinIO (file uploads)
        location /minio {
            rewrite /minio/(.*) /$1 break;
            proxy_set_header Host $host;
            proxy_pass http://minio_upstream;
        }

        # AppFlowy Web UI (fallback catch-all)
        location / {
            proxy_set_header Host $host;
            proxy_pass http://web_upstream;
        }
    }
}
