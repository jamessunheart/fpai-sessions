# Sunheart Brain — hostside nginx vhost on Secondary (162.0.208.88)
#
# Terminates TLS for brain.sunheart.com and proxies to:
#   /              → 127.0.0.1:28080 (AppFlowy stack's internal nginx)
#   /mcp/sse       → 127.0.0.1:28091 (sh-mcp-http, SSE streaming)
#   /mcp/messages/ → 127.0.0.1:28091 (sh-mcp-http, POST)
#   /mcp/healthz   → 127.0.0.1:28091 (unauthenticated liveness)
#   /index/        → 127.0.0.1:28090 (brain-index REST, OpenAPI for GPT Connector)
#   /openapi.json  → 127.0.0.1:28090 (brain-index OpenAPI spec)
#
# Install path: /etc/nginx/sites-available/brain.sunheart.com.conf
# Enable:      ln -s ../sites-available/brain.sunheart.com.conf /etc/nginx/sites-enabled/
# Cert:        certbot --nginx -d brain.sunheart.com (once DNS points at this box)

# Shared rate-limit zone (keyed by IP). We add it here instead of nginx.conf so the
# vhost is self-contained; remove the `limit_req_zone` line if it conflicts with
# an existing zone of the same name.
limit_req_zone $binary_remote_addr zone=sh_mcp:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name brain.sunheart.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brain.sunheart.com;

    ssl_certificate     /etc/letsencrypt/live/brain.sunheart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brain.sunheart.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    # --- MCP (Claude / Cursor / GPT Connector) --------------------------------

    location = /mcp/healthz {
        proxy_pass http://127.0.0.1:28091/healthz;
        proxy_set_header Host $host;
    }

    location /mcp/sse {
        # SSE: no buffering, long timeouts, rate-limited bursts
        limit_req zone=sh_mcp burst=20 nodelay;

        proxy_pass http://127.0.0.1:28091/mcp/sse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /mcp/messages/ {
        limit_req zone=sh_mcp burst=20 nodelay;

        proxy_pass http://127.0.0.1:28091/mcp/messages/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }

    # --- brain-index REST (OpenAPI surface for GPT Custom Connector) ----------

    location /index/ {
        limit_req zone=sh_mcp burst=30 nodelay;

        proxy_pass http://127.0.0.1:28090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }

    # OpenAPI spec at the root so GPT Actions/Connector discovery works.
    location = /openapi.json {
        proxy_pass http://127.0.0.1:28090/openapi.json;
        proxy_set_header Host $host;
    }

    # --- AppFlowy (everything else) -------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:28080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket (collab sync)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
