# ─── faq ──────────────────────────────────────────────────────────────────
faq:
  - q: "Is this work for me?"
    a: "If something in you is reading this and not looking away, yes. The women I work best with are tired of performing — in their work, their relationships, their bodies — and want to come home. You don't need experience. You need a yes."
  - q: "Who is this work NOT for?"
    a: "This is not therapy. I am not a substitute for a licensed clinician, and women in active mental health crisis or untreated trauma should be in a clinical container first. This is also not for women who want to be saved, fixed, or led to an answer they aren't willing to live. I work with women who are ready to do their own becoming. I will turn down clients who aren't, and I do — without apology."
  - q: "Is the surrender work sexual?"
    a: "It is erotic in the original sense — alive, embodied, charged. It is not pornographic. There is no nudity required. Every session is co-designed around your edges and your consent. Boundaries are sacred, not flexible."
  - q: "How much does it cost?"
    a: "Devotion (1:1) starts at $12,000 for a 3-month container — this is the deepest, most personal work I offer and the investment reflects that. Yielding sessions start at $1,500. Goddess Church starts at $77/month. Custom arcs are quoted after a discovery call. Payment plans are available for the right fit."
  - q: "In-person or virtual?"
    a: "1:1 coaching can be either. Surrender work is in-person only and currently offered in select cities — see the tour. Goddess Church is fully online."
  - q: "Who is Sapphire (the bot)?"
    a: "Sapphire is my AI assistant on Telegram (@LilSapphirebot). She handles questions, holds the intake conversation, and routes the right inquiries to me. She's been taught my voice, my offerings, and my standards. If you'd rather DM me on Instagram, I'm at @cheyennesapphireofficial — but Sapphire is faster."
  - q: "What if I'm not ready yet?"
    a: "Then you're not. That's not a failure — that's discernment. Sign up for the email list. Read what I share. When the timing is right, you'll know."

