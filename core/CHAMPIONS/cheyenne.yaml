# ─── methodology ──────────────────────────────────────────────────────────
method_name: "The Sapphire Path"
method_lede: "A three-pillar practice I've developed over years of holding women through the threshold. Every container — Devotion, Yielding, Goddess Church — runs through these three."
pillars:
  - num: "i · Temple"
    title: "The Body Returns"
    body: "We begin where you live. Embodiment is not a technique — it is the slow undoing of every place you abandoned yourself. Breath, sensation, the felt sense of your own intelligence. Before anything else, we come home."
  - num: "ii · Fire"
    title: "The Charge Awakens"
    body: "Tantra is the practice of polarity, devotion, and energetic mastery. Here we work with kundalini, sacred sexuality, and the erotic as a portal to the divine. The fire that the world told you to dampen — we light it."
  - num: "iii · Throne"
    title: "The Woman Who Chooses"
    body: "Sovereignty is the ground beneath surrender. You learn to yield because you have first learned to reign. Conscious dominance, the sacred no, the discernment to choose what you devote yourself to — and what you don't."

