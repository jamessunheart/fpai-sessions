# Review artifact for d026. Install on the host as:
#   /etc/systemd/system/fpai-morning-digest.service.d/visual-digest.conf
# Then run:
#   systemctl daemon-reload
#
# This appends the visual digest after the existing morning digest command
# without rewriting the fpai-morning-digest service or script.
[Service]
ExecStartPost=/usr/bin/env bash -lc 'cd /opt/fpai-build/FPAI_Cockpit && python3 -m tools.visual.visual_digest || true'
