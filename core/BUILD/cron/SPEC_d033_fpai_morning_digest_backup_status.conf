# Review artifact for d033. Install on the host as:
#   /etc/systemd/system/fpai-morning-digest.service.d/brain-backup-status.conf
# Then run:
#   systemctl daemon-reload
#
# This appends the brain backup status after the existing morning digest command
# without rewriting the fpai-morning-digest service or script.
[Service]
ExecStartPost=/usr/bin/env bash -lc 'cd /opt/fpai-build/FPAI_Cockpit && msg="$(python3 -m tools.infra.backup_status)" && tools/build_loop/notify_telegram.sh "$msg" || true'
