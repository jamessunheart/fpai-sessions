server {
    listen 80;
    listen [::]:80;
    server_name fullpotential.com www.fullpotential.com fullpotential.ai www.fullpotential.ai;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fullpotential.com www.fullpotential.com fullpotential.ai www.fullpotential.ai;

    ssl_certificate /etc/letsencrypt/live/fullpotential.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fullpotential.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ====================================================
    # 🚀 PUBLIC LANDING PAGE (Next.js)
    # ====================================================
    location / {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ====================================================
    # 🛡️ ADMIN DASHBOARDS (Protected)
    # ====================================================
    location /dashboards {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /dashboards/harvester {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8055/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ====================================================
    # ⚡ SERVICES (Submission Portals)
    # ====================================================
    # Direct link to Harvester Submission (Protected so only approved apprentices see it if you want)
    # Or keep public if you want open submissions. Let's keep public for now, or protect if desired.
    
    location /services/harvester {
        proxy_pass http://127.0.0.1:8055/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300;
    }

    # Legacy Redirects
    location /harvester {
        return 301 /services/harvester;
    }
}
