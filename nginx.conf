server {
    listen 80;
    listen [::]:80;
    server_name fullpotential.com www.fullpotential.com fullpotential.ai www.fullpotential.ai;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fullpotential.com www.fullpotential.com fullpotential.ai www.fullpotential.ai;

    ssl_certificate /etc/letsencrypt/live/fullpotential.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fullpotential.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /harvester {
        return 302 /harvester/;
    }

    location /harvester/ {
        proxy_pass http://127.0.0.1:8055/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }
}






