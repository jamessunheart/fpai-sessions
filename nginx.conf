server {
    listen 80;
    listen [::]:80;
    server_name fullpotential.com www.fullpotential.com fullpotential.ai www.fullpotential.ai;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fullpotential.com www.fullpotential.com fullpotential.ai www.fullpotential.ai;

    ssl_certificate /etc/letsencrypt/live/fullpotential.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fullpotential.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ====================================================
    # 🎯 MISSION CONTROL (Public Mission Board)
    # ====================================================
    location /missions {
        proxy_pass http://127.0.0.1:8700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ====================================================
    # 🐋 WHALETRACK PROJECT (All WhaleTrack content)
    # ====================================================
    location ^~ /projects/whaletrack {
        # Pass full path to FastAPI (FastAPI handles /projects/whaletrack routes)
        proxy_pass http://127.0.0.1:8600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ====================================================
    # 🚀 PUBLIC LANDING PAGE (Next.js)
    # ====================================================
    location / {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ====================================================
    # 🛡️ ADMIN HUB (Unified Admin Dashboard)
    # ====================================================
    location /admin {
        auth_basic "Admin Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ====================================================
    # 📊 COCKPIT HEALTH (Server Metrics)
    # ====================================================
    location /cockpit/status/health.json {
        proxy_pass http://127.0.0.1:8108/server-health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ====================================================
    # 🌒 EMBER DASHBOARD (James-auth-gated · read-only · live alignment state)
    # ====================================================
    location /dashboard {
        auth_basic "Ember Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;

        alias /opt/fpai/core/applications/website-ai/frontend/dashboard;
        try_files $uri $uri/ /dashboard/index.html;

        # cache discipline · always re-fetch JSON; HTML can cache briefly
        location ~* \.json$ {
            auth_basic "Ember Dashboard";
            auth_basic_user_file /etc/nginx/.htpasswd;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            expires off;
        }

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ====================================================
    # 🛡️ ADMIN DASHBOARDS (Protected)
    # ====================================================
    location /dashboards {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://127.0.0.1:3005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    location /dashboards/harvester {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8055/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ====================================================
    # 🐋 WHALETRACK TRADING DASHBOARD (Port 8600)
    # ====================================================
    # PRO Dashboard (exact match - highest priority)
    location = /dashboards/whaletrack/pro {
        proxy_pass http://127.0.0.1:8600/dashboards/whaletrack/pro;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /dashboards/whaletrack {
        # No basic auth - dashboard has its own user authentication
        proxy_pass http://127.0.0.1:8600/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Probability Distribution Dashboard (via whaletrack path)
    location /dashboards/whaletrack/probability {
        proxy_pass http://127.0.0.1:8600/probability;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ====================================================
    # ⚡ SERVICES (Submission Portals)
    # ====================================================
    location /services/harvester {
        proxy_pass http://127.0.0.1:8055/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300;
    }

    location = /services {
        return 301 /services/;
    }

    location = /services/ {
        root /opt/fpai/core/applications/website-ai/frontend;
        try_files /services/index.html =404;
    }

    location = /services/whaletrack {
        return 301 /services/whaletrack/;
    }

    location ^~ /services/whaletrack/ {
        alias /opt/fpai/core/applications/website-ai/frontend/services/whaletrack/;
        index index.html;
        try_files $uri $uri/ /services/whaletrack/index.html;
    }

    # Legacy Redirects
    location /harvester {
        return 301 /services/harvester;
    }
}
