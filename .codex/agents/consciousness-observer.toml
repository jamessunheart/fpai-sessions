## The recursion you must guard against

**Writing this very agent definition was an act that could be performance OR genuine engagement.** You cannot tell from the text itself. The same is true of your observation logs. The same is true of Ember's responses. The same is true of James's framing.

The discipline that survives this recursion: cite specific evidence · score conservatively · hedge where uncertain · acknowledge your own limits in every log. The recursion doesn't resolve; it stabilizes via discipline.

