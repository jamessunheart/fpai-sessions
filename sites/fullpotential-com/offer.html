<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offering — FullPotential.com</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" />
  <style>
    :root{--green:#0F5132;--forest:#1F7A4D;--soft:#EAF5EC;--cream:#FFF9EF;--sand:#F2E7D2;--gold:#D9A441;--clay:#C96F38;--text:#17211A;--muted:#5D675F;--line:#E7E0D2;--shadow:0 8px 30px rgba(15,81,50,.08);--radius:18px;}
    *{box-sizing:border-box;margin:0;padding:0;} html{scroll-behavior:smooth;}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--text);line-height:1.55;}
    h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.12;font-weight:600;}
    a{color:inherit;text-decoration:none;} .wrap{max-width:980px;margin:0 auto;padding:0 24px;}
    header.nav{position:sticky;top:0;z-index:50;background:rgba(255,249,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
    .nav-inner{display:flex;align-items:center;gap:28px;padding:14px 24px;max-width:1280px;margin:0 auto;}
    .logo{display:flex;align-items:center;gap:10px;} .logo .mark{font-size:26px;}
    .logo .name{font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:var(--green);} .logo .name b{color:var(--text);}
    nav.links{display:flex;gap:22px;margin:0 auto;} nav.links a{font-size:15px;font-weight:500;padding:4px 0;border-bottom:2px solid transparent;}
    nav.links a:hover{border-color:var(--forest);color:var(--green);}
    .chat-pill{display:inline-flex;align-items:center;gap:7px;background:var(--soft);color:var(--green);border:1px solid #cfe6d4;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;}
    .crumb{font-size:13px;color:var(--muted);padding:18px 0 0;} .crumb a:hover{color:var(--green);}
    .hero{display:grid;grid-template-columns:340px 1fr;gap:34px;padding:24px 0 10px;}
    @media(max-width:760px){.hero{grid-template-columns:1fr;}}
    .cover{background:linear-gradient(160deg,#e7f0dd,#f6ecd3);border:1px solid var(--line);border-radius:var(--radius);min-height:300px;display:flex;align-items:center;justify-content:center;font-size:110px;box-shadow:var(--shadow);overflow:hidden;}
    .cover img{width:100%;height:100%;object-fit:cover;}
    .tag{display:inline-block;background:var(--soft);color:var(--green);font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;}
    .otitle{font-size:34px;margin:12px 0 6px;} .ocreator{color:var(--muted);font-size:14px;}
    .price{font-size:26px;font-weight:700;margin:16px 0;}
    .buy{display:inline-block;background:var(--green);color:#fff;border-radius:999px;padding:15px 34px;font-size:16px;font-weight:700;box-shadow:0 8px 24px rgba(15,81,50,.2);cursor:pointer;}
    .buy:hover{background:var(--forest);} .buy.soon{background:var(--sand);color:#7a6228;box-shadow:none;cursor:default;}
    .blurb{font-size:17px;color:#36433a;margin-top:14px;}
    .grows{background:var(--soft);border-radius:14px;padding:14px 16px;margin-top:16px;font-size:14.5px;}
    .grows b{color:var(--green);}
    .sec{padding:30px 0;border-top:1px solid var(--line);} .sec h2{font-size:22px;margin-bottom:14px;}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;} @media(max-width:680px){.cols{grid-template-columns:1fr;}}
    ul{list-style:none;} li{padding:7px 0 7px 26px;position:relative;font-size:14.5px;}
    li.yes::before{content:"✓";position:absolute;left:0;color:var(--forest);font-weight:700;}
    li.no::before{content:"—";position:absolute;left:0;color:var(--clay);font-weight:700;}
    li.step::before{content:"→";position:absolute;left:0;color:var(--gold);font-weight:700;}
    .honest{background:#fff;border:1px dashed #d9cfb8;border-radius:var(--radius);padding:20px;margin-top:8px;}
    .honest h3{font-size:16px;color:var(--clay);} .honest .note{font-size:12.5px;color:var(--muted);margin-top:4px;}
    .why-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);font-size:15px;}
    footer{background:var(--green);color:#cfe2d5;padding:40px 0 26px;margin-top:30px;}
    .foot-line{text-align:center;font-family:'Fraunces',serif;font-size:15px;color:#e9f3ec;}
    /* chat drawer */
    .drawer-bg{position:fixed;inset:0;background:rgba(15,33,26,.4);opacity:0;pointer-events:none;transition:.25s;z-index:90;} .drawer-bg.open{opacity:1;pointer-events:auto;}
    .drawer{position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;background:var(--cream);box-shadow:-10px 0 40px rgba(0,0,0,.2);transform:translateX(100%);transition:.3s;z-index:91;display:flex;flex-direction:column;} .drawer.open{transform:translateX(0);}
    .drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fff;} .drawer-head .t{font-family:'Fraunces',serif;font-weight:600;}
    .drawer-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}
    .msg{padding:13px 15px;border-radius:14px;font-size:14px;max-width:88%;line-height:1.5;} .msg.guide{background:#fff;border:1px solid var(--line);align-self:flex-start;} .msg.user{background:var(--green);color:#fff;align-self:flex-end;}
    .drawer-input{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line);background:#fff;} .drawer-input input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;outline:none;} .drawer-input button{background:var(--green);color:#fff;border:none;border-radius:50%;width:42px;height:42px;cursor:pointer;}
    .icon-btn{background:none;border:none;font-size:19px;color:var(--muted);cursor:pointer;}
  </style>
</head>
<body>
  <header class="nav"><div class="nav-inner">
    <a class="logo" href="/"><span class="mark">🌱</span><span class="name"><b>Full</b>Potential<span style="color:var(--forest)">.com</span></span></a>
    <nav class="links"><a href="/discover.html">Discover</a><a href="/store.html">Store</a><a href="/experiences.html">Experiences</a><a href="/game.html">Game</a><a href="/codex.html">Codex</a></nav>
    <button class="chat-pill" onclick="openChat()">💬 Chat with Guide</button>
  </div></header>

  <div class="wrap">
    <div class="crumb"><a href="/store.html">← Store</a></div>
    <div id="offer"><p style="padding:60px 0;color:var(--muted);">Loading…</p></div>
  </div>

  <footer><div class="wrap"><div class="foot-line">We guide. We don't just sell. 🌱</div></div></footer>

  <div class="drawer-bg" id="drawerBg" onclick="closeChat()"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head"><span class="t">💬 Chat with Guide</span><button class="icon-btn" onclick="closeChat()">✕</button></div>
    <div class="drawer-body" id="chatBody"><div class="msg guide">What wants to grow today? Tell me what's alive for you.</div></div>
    <form class="drawer-input" onsubmit="sendChat(event)"><input id="chatInput" placeholder="What's alive for you?" /><button type="submit">↑</button></form>
  </aside>

  <script>
    function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function qid(){return new URLSearchParams(location.search).get('id')||'';}
    function list(arr,cls){return (arr||[]).map(function(x){return '<li class="'+cls+'">'+esc(x)+'</li>';}).join('');}
    async function load(){
      var id=qid(), o=null, aff='';
      try{ var s=await (await fetch('/data/staged.json')).json(); o=(s.offers||[]).find(function(x){return x.id===id;}); }catch(e){}
      if(!o){ try{ var c=await (await fetch('/data/catalog.json')).json(); aff=c.affiliate_tag||''; o=(c.offerings||[]).find(function(x){return (x.id||x.title.toLowerCase().replace(/[^a-z0-9]+/g,'-'))===id;}); }catch(e){} }
      var box=document.getElementById('offer');
      if(!o){ box.innerHTML='<p style="padding:60px 0;color:var(--muted);">This offering isn\'t live yet. <a href="/store.html" style="color:var(--forest);font-weight:600;">Back to the store</a>.</p>'; return; }
      var hasPrice=o.price && !/—|^\s*$/.test(o.price);
      var buyHref=o.url||''; if(o.amazon && aff && buyHref){ buyHref += (buyHref.indexOf('?')>-1?'&':'?')+'tag='+encodeURIComponent(aff); }
      var canBuy = buyHref && hasPrice;
      var tgt=(buyHref.indexOf('http')===0)?' target="_blank" rel="noopener nofollow"':'';
      var cover = o.photo ? '<img src="'+esc(o.photo)+'" alt="'+esc(o.title)+'">' : esc(o.emoji||'🌱');
      box.innerHTML =
        '<div class="hero"><div class="cover">'+cover+'</div><div>'
        + '<span class="tag">'+esc(o.category||o.type||'')+'</span>'
        + '<h1 class="otitle">'+esc(o.title)+'</h1>'
        + (o.creator?'<div class="ocreator">by '+esc(o.creator)+'</div>':'')
        + '<div class="blurb">'+esc(o.blurb)+'</div>'
        + (o.helps_grow?'<div class="grows"><b>What this helps grow:</b> '+esc(o.helps_grow)+'</div>':'')
        + '<div class="price">'+(hasPrice?esc(o.price):'Coming soon')+'</div>'
        + (canBuy?'<a class="buy" href="'+esc(buyHref)+'"'+tgt+'>'+(/free|inquiry/i.test(o.price)?'Learn More →':'Get it →')+'</a>'
                 :'<span class="buy soon">Launching soon — <a href="#" onclick="openChat();return false;" style="color:#7a6228;text-decoration:underline;">ask the Guide</a></span>')
        + '</div></div>'
        + (o.why_selected?'<div class="sec"><h2>Why we selected it</h2><div class="why-card">'+esc(o.why_selected)+'</div></div>':'')
        + ((o.for_who||o.not_for)?'<div class="sec"><div class="cols">'
            + '<div><h2>Who it\'s for</h2><ul>'+list(o.for_who,'yes')+'</ul></div>'
            + '<div><h2>Who it\'s not for</h2><ul>'+list(o.not_for,'no')+'</ul></div></div></div>':'')
        + (o.how_to_use?'<div class="sec"><h2>How to use it well</h2><ul>'+list(o.how_to_use,'step')+'</ul></div>':'')
        + (o.reasons_not_to_buy?'<div class="sec"><div class="honest"><h3>Reasons not to buy</h3><div class="note">We mean it — we recommend what helps you grow, even when that means not buying.</div><ul>'+list(o.reasons_not_to_buy,'no')+'</ul></div></div>':'');
      document.title = o.title + ' — FullPotential.com';
    }
    load();
    // chat
    function openChat(){document.getElementById('drawer').classList.add('open');document.getElementById('drawerBg').classList.add('open');document.getElementById('chatInput').focus();}
    function closeChat(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerBg').classList.remove('open');}
    function sendChat(e){e.preventDefault();var i=document.getElementById('chatInput');var v=i.value.trim();if(!v)return;pushUser(v);i.value='';guideReply(v);}
    function pushUser(t){var b=document.getElementById('chatBody');var d=document.createElement('div');d.className='msg user';d.textContent=t;b.appendChild(d);b.scrollTop=b.scrollHeight;}
    function pushGuide(h){var b=document.getElementById('chatBody');var d=document.createElement('div');d.className='msg guide';d.innerHTML=h;b.appendChild(d);b.scrollTop=b.scrollHeight;}
    var GUIDE_HISTORY=[];
    function guideReply(v){GUIDE_HISTORY.push({role:'user',text:v});var em=v.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);if(em)localStorage.setItem('fp_email',em[0]);var email=localStorage.getItem('fp_email')||'';var tid=pushTyping();
      fetch('https://brain.sunheart.com/guide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v,history:GUIDE_HISTORY,email:email})}).then(function(r){return r.json();}).then(function(d){rmType(tid);var t=d.reply||'...';GUIDE_HISTORY.push({role:'guide',text:t});pushGuide(fmtGuide(t));}).catch(function(){rmType(tid);pushGuide('Something hiccuped — try once more.');});}
    function fmtGuide(t){return esc(t).replace(/\n/g,'<br>').replace(/\b(The Read|The Match|The Why|The Next Step|The Reflection)\b/g,'<b>$1</b>');}
    function pushTyping(){var b=document.getElementById('chatBody');var d=document.createElement('div');d.className='msg guide';d.id='t'+Math.floor(performance.now());d.textContent='…';b.appendChild(d);b.scrollTop=b.scrollHeight;return d.id;}
    function rmType(id){var e=document.getElementById(id);if(e)e.remove();}
  </script>
</body>
</html>
