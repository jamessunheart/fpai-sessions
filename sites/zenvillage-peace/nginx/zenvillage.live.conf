# /etc/nginx/sites-available/zenvillage.live.conf
# Managed manually for routing; SSL block managed by certbot.
# DO NOT overwrite blindly — re-run certbot if you do.

server {
    server_name zenvillage.live www.zenvillage.live;

    root /var/www/zenvillage-live;
    index index.html;

    # Bare domain → /peace (only page that exists for now).
    location = / { return 302 /peace; }

    # === Event/RSVP API + ticket pages — proxy to zen-village service (port 8770) ===
    # Keeps everything same-origin so the inline RSVP modal on /peace works
    # without CORS gymnastics. The zen-pass system also serves the ticket
    # display page at /pass/{id} which we reuse for confirmation.
    location /api/pass/ {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /pass {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Affiliates API — ?ref tracking, conversion hooks, application queue ===
    # Used by /reset landing page + /reset/affiliate-signup
    location /api/affiliates/ {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # === Inquiries API — lead capture from /reset and /peace landing pages ===
    location /api/inquiries/ {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # === Static landing page ===
    location /peace {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # === 5 Day Reset Retreat landing + invite-only affiliate signup ===
    location /reset {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # === Event management portal (admin-key gated client-side) ===
    location /manage {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # === Frictionless item-buy page (scanned from item QR codes) ===
    location /buy {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/zenvillage.live.access.log;
    error_log  /var/log/nginx/zenvillage.live.error.log;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zenvillage.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zenvillage.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.zenvillage.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = zenvillage.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name zenvillage.live www.zenvillage.live;
    return 404; # managed by Certbot
}
