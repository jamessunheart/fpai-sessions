# /etc/nginx/sites-available/zenvillage.live.conf
# HTTP-only initial config. After DNS is pointing at 198.54.123.234,
# run: certbot --nginx -d zenvillage.live -d www.zenvillage.live
# Certbot will append the 443 server block automatically.

server {
    server_name zenvillage.live www.zenvillage.live;

    root /var/www/zenvillage-live;
    index index.html;

    # Send the bare domain to /peace for now (the only page that exists).
    # Remove this once a real homepage is built.
    location = / { return 302 /peace; }

    # The actual landing page lives at /var/www/zenvillage-live/peace/index.html
    location /peace {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Caching for static assets
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/zenvillage.live.access.log;
    error_log  /var/log/nginx/zenvillage.live.error.log;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zenvillage.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zenvillage.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.zenvillage.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = zenvillage.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name zenvillage.live www.zenvillage.live;
    return 404; # managed by Certbot




}