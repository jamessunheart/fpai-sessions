server {
    server_name zenvillagecr.com www.zenvillagecr.com;


    # DISABLED 2026-05-04 (was rewriting /peace to legacy site): # WORLD PEACE REDIRECT — send /peace traffic to the event site (zenvillage.live)
    # DISABLED 2026-05-04 (was rewriting /peace to legacy site): location = /peace { return 301 https://zenvillage.live/peace; }
    # DISABLED 2026-05-04 (was rewriting /peace to legacy site): location = /peace/ { return 301 https://zenvillage.live/peace; }
    # DISABLED 2026-05-04 (was rewriting /peace to legacy site): location ^~ /peace/ { return 301 https://zenvillage.live$request_uri; }

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    # === Legacy admin page → new cockpit hub (added 2026-05-23) ============
    location = /admin/submissions { return 301 https://zenvillagecr.com/cockpit; }
    location = /admin/submissions/ { return 301 https://zenvillagecr.com/cockpit; }

    # === 5 Day Reset Retreat landing + invite-only affiliate signup ==========
    # Canonical home of the retreat page. Static files live at /var/www/zenvillage-live/
    # (deployed from sites/zenvillage-peace/ via ./deploy.sh — shared with zenvillage.live).
    # try_files extended with $uri.html so /reset/affiliate-signup resolves
    # to affiliate-signup.html without needing a subdir + index.html.
    location /reset {
        root /var/www/zenvillage-live;
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zenvillagecr.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zenvillagecr.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.zenvillagecr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = zenvillagecr.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name zenvillagecr.com www.zenvillagecr.com;
    return 404; # managed by Certbot




}